<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard de Área Queimada</title>


    <!-- ==========================================================
         LEAFLET
    =========================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- ==========================================================
         ESTILO
    =========================================================== -->

    <style>

        /* ======================================================
           VARIÁVEIS - TEMA CLARO
        ====================================================== */

        :root {

            --bg-principal: #f3f5f7;

            --bg-painel: #ffffff;

            --bg-painel-secundario: #f8fafb;

            --texto-principal: #1f2933;

            --texto-secundario: #667085;

            --borda: #dfe4e8;

            --sombra:
                0 8px 25px rgba(15, 23, 42, 0.12);

            --sombra-leve:
                0 3px 12px rgba(15, 23, 42, 0.10);

            --primaria: #7f0000;

            --primaria-hover: #a30000;

            --mapa-filtro: none;

            --popup-bg: #ffffff;

            --popup-texto: #1f2933;

            --controle-bg: rgba(255,255,255,0.96);

            --controle-texto: #222;

            --legenda-bg: rgba(255,255,255,0.97);

            --legenda-texto: #333;

        }


        /* ======================================================
           TEMA ESCURO
        ====================================================== */

        body.tema-escuro {

            --bg-principal: #11161c;

            --bg-painel: #171d24;

            --bg-painel-secundario: #1d252e;

            --texto-principal: #f2f4f7;

            --texto-secundario: #aeb7c2;

            --borda: #303a45;

            --sombra:
                0 8px 25px rgba(0,0,0,0.40);

            --sombra-leve:
                0 3px 12px rgba(0,0,0,0.35);

            --primaria: #d7301f;

            --primaria-hover: #ef6548;

            --mapa-filtro:
                brightness(0.82)
                contrast(1.05)
                saturate(0.85);

            --popup-bg: #1c242d;

            --popup-texto: #f2f4f7;

            --controle-bg: rgba(25,32,40,0.96);

            --controle-texto: #f2f4f7;

            --legenda-bg: rgba(25,32,40,0.97);

            --legenda-texto: #f2f4f7;

        }


        /* ======================================================
           RESET
        ====================================================== */

        * {

            box-sizing: border-box;

        }


        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            min-height: 100%;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                Helvetica,
                sans-serif;

            background:
                var(--bg-principal);

            color:
                var(--texto-principal);

            transition:
                background 0.25s ease,
                color 0.25s ease;

        }


        body {

            overflow: hidden;

        }


        /* ======================================================
           CABEÇALHO
        ====================================================== */

        #cabecalho {

            position: absolute;

            top: 18px;

            left: 18px;

            z-index: 1000;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;

            width:
                calc(100% - 36px);

            max-width: 900px;

            padding:
                16px 20px;

            background:
                var(--controle-bg);

            border:
                1px solid var(--borda);

            border-radius: 12px;

            box-shadow:
                var(--sombra);

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

        }


        /* ======================================================
           TÍTULO
        ====================================================== */

        .cabecalho-titulo {

            display: flex;

            align-items: center;

            gap: 13px;

            min-width: 0;

        }


        .icone-dashboard {

            width: 42px;

            height: 42px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 10px;

            background:
                var(--primaria);

            color: white;

            font-size: 21px;

            box-shadow:
                0 4px 10px rgba(127,0,0,0.25);

        }


        .titulo-principal {

            margin: 0;

            font-size: 19px;

            line-height: 1.2;

            font-weight: 700;

            letter-spacing: -0.2px;

            color:
                var(--texto-principal);

        }


        .subtitulo {

            margin-top: 4px;

            font-size: 12px;

            color:
                var(--texto-secundario);

        }


        /* ======================================================
           BOTÃO TEMA
        ====================================================== */

        #botao-tema {

            width: 40px;

            height: 40px;

            flex-shrink: 0;

            border:
                1px solid var(--borda);

            border-radius: 9px;

            background:
                var(--bg-painel-secundario);

            color:
                var(--texto-principal);

            cursor: pointer;

            font-size: 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            transition:
                all 0.2s ease;

        }


        #botao-tema:hover {

            background:
                var(--primaria);

            color: white;

            border-color:
                var(--primaria);

            transform:
                translateY(-1px);

        }


        /* ======================================================
           MAPA
        ====================================================== */

        #mapa {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 100vh;

            z-index: 1;

        }


        /* ======================================================
           FILTRO DO MAPA NO TEMA ESCURO
        ====================================================== */

        body.tema-escuro
        .leaflet-tile-pane {

            filter:
                var(--mapa-filtro);

        }


        /* ======================================================
           CONTROLE DE CAMADAS
        ====================================================== */

        .leaflet-control-layers {

            background:
                var(--controle-bg) !important;

            color:
                var(--controle-texto) !important;

            border:
                1px solid var(--borda) !important;

            border-radius:
                10px !important;

            box-shadow:
                var(--sombra) !important;

            overflow:
                hidden;

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

        }


        .leaflet-control-layers-expanded {

            padding:
                12px 14px !important;

            min-width:
                150px;

        }


        .leaflet-control-layers-list {

            margin: 0;

        }


        .leaflet-control-layers-base {

            color:
                var(--controle-texto);

        }


        .leaflet-control-layers label {

            display: flex;

            align-items: center;

            gap: 7px;

            margin:
                5px 0;

            color:
                var(--controle-texto);

            font-size: 13px;

            cursor: pointer;

        }


        .leaflet-control-layers-selector {

            accent-color:
                var(--primaria);

        }


        /* ======================================================
           CONTROLES LEAFLET
        ====================================================== */

        .leaflet-control-zoom {

            border:
                1px solid var(--borda) !important;

            border-radius:
                9px !important;

            overflow:
                hidden;

            box-shadow:
                var(--sombra-leve) !important;

        }


        .leaflet-control-zoom a {

            background:
                var(--controle-bg) !important;

            color:
                var(--controle-texto) !important;

            border-color:
                var(--borda) !important;

        }


        .leaflet-control-zoom a:hover {

            background:
                var(--primaria) !important;

            color:
                white !important;

        }


        /* ======================================================
           LEGENDA
        ====================================================== */

        .legenda-ranking {

            background:
                var(--legenda-bg);

            padding:
                14px 16px;

            line-height:
                21px;

            color:
                var(--legenda-texto);

            box-shadow:
                var(--sombra);

            border:
                1px solid var(--borda);

            border-radius:
                10px;

            font-size:
                12px;

            min-width:
                155px;

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

        }


        .legenda-titulo {

            display: flex;

            align-items: center;

            gap: 7px;

            margin-bottom:
                9px;

            padding-bottom:
                8px;

            border-bottom:
                1px solid var(--borda);

            font-size:
                13px;

            font-weight:
                700;

            color:
                var(--texto-principal);

        }


        .legenda-titulo::before {

            content: "";

            width: 7px;

            height: 7px;

            border-radius: 50%;

            background:
                var(--primaria);

        }


        .legenda-ranking div {

            display: flex;

            align-items: center;

            height:
                22px;

        }


        .legenda-ranking i {

            width:
                18px;

            height:
                14px;

            margin-right:
                8px;

            display:
                inline-block;

            border:
                1px solid rgba(0,0,0,0.22);

            border-radius:
                3px;

            box-sizing:
                border-box;

        }


        /* ======================================================
           POPUP
        ====================================================== */

        .leaflet-popup-content-wrapper {

            background:
                var(--popup-bg);

            color:
                var(--popup-texto);

            border-radius:
                10px;

            box-shadow:
                var(--sombra);

        }


        .leaflet-popup-tip {

            background:
                var(--popup-bg);

        }


        .leaflet-popup-content {

            margin:
                14px 16px;

            min-width:
                190px;

            color:
                var(--popup-texto);

            font-size:
                13px;

            line-height:
                1.6;

        }


        .popup-nome {

            font-size:
                16px;

            font-weight:
                700;

            margin-bottom:
                8px;

            color:
                var(--texto-principal);

        }


        .popup-linha {

            padding:
                4px 0;

            border-top:
                1px solid var(--borda);

        }


        .popup-label {

            color:
                var(--texto-secundario);

        }


        .popup-valor {

            font-weight:
                700;

            color:
                var(--texto-principal);

        }


        .leaflet-popup-close-button {

            color:
                var(--texto-secundario) !important;

        }


        /* ======================================================
           INDICADOR INFORMATIVO
        ====================================================== */

        #painel-info {

            position: absolute;

            left: 18px;

            bottom: 22px;

            z-index: 1000;

            padding:
                10px 14px;

            background:
                var(--controle-bg);

            border:
                1px solid var(--borda);

            border-radius:
                9px;

            box-shadow:
                var(--sombra-leve);

            color:
                var(--texto-secundario);

            font-size:
                11px;

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

        }


        #painel-info strong {

            color:
                var(--texto-principal);

        }


        /* ======================================================
           ESCONDER ATRIBUIÇÃO COM VISUAL MAIS LIMPO
        ====================================================== */

        .leaflet-control-attribution {

            background:
                var(--controle-bg) !important;

            color:
                var(--texto-secundario) !important;

            border-radius:
                5px 0 0 0;

        }


        .leaflet-control-attribution a {

            color:
                var(--texto-secundario) !important;

        }


        /* ======================================================
           RESPONSIVO
        ====================================================== */

        @media (max-width: 700px) {

            #cabecalho {

                top: 10px;

                left: 10px;

                width:
                    calc(100% - 20px);

                padding:
                    12px 14px;

            }


            .icone-dashboard {

                width: 36px;

                height: 36px;

                font-size: 18px;

            }


            .titulo-principal {

                font-size: 16px;

            }


            .subtitulo {

                font-size: 10px;

            }


            #botao-tema {

                width: 36px;

                height: 36px;

            }


            .leaflet-control-layers {

                margin-top:
                    75px !important;

            }


            .legenda-ranking {

                font-size:
                    11px;

                min-width:
                    135px;

                padding:
                    10px 12px;

            }


            #painel-info {

                left: 10px;

                bottom: 15px;

                max-width:
                    220px;

            }

        }

    </style>

</head>


<body>


<!-- ==========================================================
     CABEÇALHO
=========================================================== -->

<div id="cabecalho">

    <div class="cabecalho-titulo">

        <div class="icone-dashboard">

            🔥

        </div>


        <div>

            <h1 class="titulo-principal">

                Dashboard de Área Queimada

            </h1>


            <div class="subtitulo">

                Distribuição espacial do ranking de área queimada

            </div>

        </div>

    </div>


    <button
        id="botao-tema"
        title="Alternar modo claro/escuro"
        aria-label="Alternar modo claro/escuro"
    >

        🌙

    </button>

</div>



<!-- ==========================================================
     MAPA
=========================================================== -->

<div id="mapa"></div>



<!-- ==========================================================
     PAINEL INFORMATIVO
=========================================================== -->

<div id="painel-info">

    <strong>Visualização:</strong>

    Estados e Biomas

</div>



<script>


// ============================================================
// 1. MAPA
// ============================================================

const mapa = L.map("mapa").setView(

    [-14.2, -51.9],

    4

);



// ============================================================
// 2. MAPA BASE
// ============================================================

const camadaBase =
    L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

            attribution:
                "&copy; OpenStreetMap contributors",

            maxZoom: 18

        }

    );


camadaBase.addTo(mapa);



// ============================================================
// 3. ARQUIVOS DOS ESTADOS
// ============================================================

const arquivosEstados = [

    "estados_2024_01.geojson",

    "estados_2024_02.geojson",

    "estados_2024_03.geojson"

];



// ============================================================
// 4. ARQUIVOS DOS BIOMAS
// ============================================================

const arquivosBiomas = [

    "biomas_2024_01.geojson",

    "biomas_2024_02.geojson",

    "biomas_2024_03.geojson",

    "biomas_2024_04.geojson",

    "biomas_2024_05.geojson"

];



// ============================================================
// 5. NORMALIZAR TEXTO
// ============================================================

function normalizarTexto(valor) {

    if (

        valor === null ||

        valor === undefined

    ) {

        return "";

    }


    return String(valor)

        .trim()

        .toLowerCase()

        .normalize("NFD")

        .replace(

            /[\u0300-\u036f]/g,

            ""

        );

}



// ============================================================
// 6. OBTER NOME DA FEIÇÃO
// ============================================================

function obterNome(feature) {

    const p =
        feature.properties || {};


    const camposNome = [

        "region_nam",

        "Region Name",

        "NAME_1",

        "NM_ESTADO",

        "NM_UF",

        "NAME",

        "nome",

        "Nome",

        "name",

        "NAME_0",

        "Region"

    ];


    for (

        const campo of camposNome

    ) {

        if (

            p[campo] !== undefined &&

            p[campo] !== null &&

            String(p[campo]).trim() !== ""

        ) {

            return String(
                p[campo]
            );

        }

    }


    return "Sem nome";

}



// ============================================================
// 7. VERIFICAR SE É BRASIL
// ============================================================

function ehBrasil(feature) {

    const p =
        feature.properties || {};


    const camposPais =
        Object.keys(p).filter(

            campo => {

                const campoNormalizado =

                    normalizarTexto(campo)

                        .replace(
                            /[^a-z0-9]/g,
                            ""
                        );


                return [

                    "country",

                    "pais",

                    "name0",

                    "countryname",

                    "nomepais",

                    "nomedopais"

                ].includes(

                    campoNormalizado

                );

            }

        );


    if (
        camposPais.length > 0
    ) {

        for (

            const campo of camposPais

        ) {

            const pais =

                normalizarTexto(
                    p[campo]
                );


            if (

                pais === "brazil" ||

                pais === "brasil"

            ) {

                return true;

            }

        }


        return false;

    }


    const estadosBrasil = new Set([

        "acre",

        "alagoas",

        "amapa",

        "amazonas",

        "bahia",

        "ceara",

        "distrito federal",

        "espirito santo",

        "goias",

        "maranhao",

        "mato grosso",

        "mato grosso do sul",

        "minas gerais",

        "para",

        "paraiba",

        "parana",

        "pernambuco",

        "piaui",

        "rio de janeiro",

        "rio grande do norte",

        "rio grande do sul",

        "rondonia",

        "roraima",

        "santa catarina",

        "sao paulo",

        "sergipe",

        "tocantins"

    ]);


    return estadosBrasil.has(

        normalizarTexto(
            obterNome(feature)
        )

    );

}



// ============================================================
// 8. OBTER RANKING
// ============================================================

function obterRanking(feature) {

    const p =
        feature.properties || {};


    const camposRanking = [

        "Rank_Category",

        "Burned Area Rank",

        "Burned_Area_Rank",

        "Ranking",

        "ranking",

        "Rank",

        "rank"

    ];


    for (

        const campo of camposRanking

    ) {

        if (

            p[campo] !== undefined &&

            p[campo] !== null &&

            p[campo] !== ""

        ) {

            const valor =

                Number(
                    p[campo]
                );


            if (
                Number.isFinite(valor)
            ) {

                return valor;

            }

        }

    }


    return null;

}



// ============================================================
// 9. OBTER ÁREA QUEIMADA
// ============================================================

function obterArea(feature) {

    const p =
        feature.properties || {};


    const camposArea = [

        "Burned Area (km^2)",

        "Burned_Area_km2",

        "Burned Area",

        "burned_area",

        "area_queimada",

        "Area Queimada"

    ];


    for (

        const campo of camposArea

    ) {

        if (

            p[campo] !== undefined &&

            p[campo] !== null &&

            p[campo] !== ""

        ) {

            const valor =

                Number(
                    p[campo]
                );


            if (
                Number.isFinite(valor)
            ) {

                return valor;

            }

        }

    }


    return null;

}



// ============================================================
// 10. CORES DO RANKING
// ============================================================

function corRanking(rank) {

    if (

        rank === null ||

        rank === undefined

    ) {

        return "#cccccc";

    }


    rank =
        Number(rank);


    if (rank === 1)
        return "#7f0000";


    if (rank === 2)
        return "#b30000";


    if (rank === 3)
        return "#d7301f";


    if (rank === 4)
        return "#ef6548";


    if (rank === 5)
        return "#fdae61";


    if (

        rank >= 6 &&

        rank <= 18

    )

        return "#bdbdbd";


    if (rank === 19)
        return "#c6dbef";


    if (rank === 20)
        return "#9ecae1";


    if (rank === 21)
        return "#6baed6";


    if (rank === 22)
        return "#4292c6";


    if (rank === 23)
        return "#2171b5";


    if (rank === 24)
        return "#084594";


    return "#cccccc";

}



// ============================================================
// 11. ESTILO DOS POLÍGONOS
// ============================================================

function estiloPorRanking(feature) {

    const rank =
        obterRanking(feature);


    return {

        fillColor:
            corRanking(rank),

        weight: 1,

        opacity: 1,

        color:
            document.body.classList.contains("tema-escuro")
                ? "#b8c0c8"
                : "#555",

        fillOpacity: 0.78

    };

}



// ============================================================
// 12. ESCAPAR HTML
// ============================================================

function escaparHTML(valor) {

    if (

        valor === null ||

        valor === undefined

    ) {

        return "";

    }


    return String(valor)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ============================================================
// 13. FORMATAÇÃO DA ÁREA
// ============================================================

function formatarArea(valor) {

    if (

        valor === null ||

        valor === undefined ||

        !Number.isFinite(Number(valor))

    ) {

        return "Não disponível";

    }


    return Number(valor).toLocaleString(

        "pt-BR",

        {

            minimumFractionDigits: 2,

            maximumFractionDigits: 2

        }

    );

}



// ============================================================
// 14. POPUP
// ============================================================

function popupRanking(

    feature,

    layer

) {

    const nome =
        obterNome(feature);


    const rank =
        obterRanking(feature);


    const area =
        obterArea(feature);


    let html = `

        <div class="popup-nome">

            ${escaparHTML(nome)}

        </div>

    `;


    if (
        rank !== null
    ) {

        html += `

            <div class="popup-linha">

                <span class="popup-label">

                    Ranking

                </span>

                <br>

                <span class="popup-valor">

                    ${rank}º lugar

                </span>

            </div>

        `;

    }


    if (
        area !== null
    ) {

        html += `

            <div class="popup-linha">

                <span class="popup-label">

                    Área queimada

                </span>

                <br>

                <span class="popup-valor">

                    ${formatarArea(area)} km²

                </span>

            </div>

        `;

    }


    layer.bindPopup(
        html
    );

}



// ============================================================
// 15. GRUPOS DAS CAMADAS
// ============================================================

const grupoEstados =
    L.layerGroup();


const grupoBiomas =
    L.layerGroup();



// ============================================================
// 16. CARREGAR ARQUIVOS
// ============================================================

async function carregarArquivos(

    listaArquivos,

    somenteBrasil = false

) {

    let todasFeatures = [];


    for (

        const arquivo of listaArquivos

    ) {

        try {

            console.log(

                "Carregando:",

                arquivo

            );


            const resposta =
                await fetch(
                    arquivo
                );


            if (!resposta.ok) {

                throw new Error(

                    `Erro HTTP ${resposta.status}`

                );

            }


            const dados =
                await resposta.json();


            let features =
                dados.features || [];


            console.log(

                `${arquivo}: ${features.length} feições`

            );


            // ==================================================
            // FILTRO BRASIL
            // ==================================================

            if (somenteBrasil) {

                const totalAntes =
                    features.length;


                features =
                    features.filter(

                        feature =>
                            ehBrasil(feature)

                    );


                console.log(

                    `${arquivo}: ${features.length} feições brasileiras de ${totalAntes}`

                );

            }


            /*
               Não removemos duplicados.

               Os arquivos podem representar
               partes espaciais da camada.
            */

            todasFeatures.push(

                ...features

            );

        }

        catch (erro) {

            console.error(

                `Erro ao carregar ${arquivo}:`,

                erro

            );

        }

    }


    console.log(

        "Total de feições carregadas:",

        todasFeatures.length

    );


    return {

        type:
            "FeatureCollection",

        features:
            todasFeatures

    };

}



// ============================================================
// 17. CRIAR CAMADA GEOJSON
// ============================================================

function criarCamada(data) {

    return L.geoJSON(

        data,

        {

            style:
                estiloPorRanking,

            onEachFeature:
                popupRanking

        }

    );

}

// ============================================================
// 24. TEMA CLARO / ESCURO
// ============================================================

const botaoTema =
    document.getElementById(
        "botao-tema"
    );



function atualizarIconeTema() {

    if (
        document.body.classList.contains(
            "tema-escuro"
        )
    ) {

        botaoTema.textContent =
            "☀️";

        botaoTema.title =
            "Ativar modo claro";

    }

    else {

        botaoTema.textContent =
            "🌙";

        botaoTema.title =
            "Ativar modo escuro";

    }

}



botaoTema.addEventListener(

    "click",

    function() {

        document.body.classList.toggle(

            "tema-escuro"

        );


        atualizarIconeTema();


        /*
           Atualiza a borda dos polígonos
           depois da troca de tema.
        */

        if (mapa.hasLayer(grupoEstados)) {

            grupoEstados.eachLayer(

                camada => {

                    if (
                        camada.eachLayer
                    ) {

                        camada.eachLayer(

                            layer => {

                                if (
                                    layer.setStyle
                                ) {

                                    layer.setStyle(

                                        estiloPorRanking(

                                            layer.feature

                                        )

                                    );

                                }

                            }

                        );

                    }

                }

            );

        }


        if (mapa.hasLayer(grupoBiomas)) {

            grupoBiomas.eachLayer(

                camada => {

                    if (
                        camada.eachLayer
                    ) {

                        camada.eachLayer(

                            layer => {

                                if (
                                    layer.setStyle
                                ) {

                                    layer.setStyle(

                                        estiloPorRanking(

                                            layer.feature

                                        )

                                    );

                                }

                            }

                        );

                    }

                }

            );

        }

    }

);



// ============================================================
// 25. INICIALIZAÇÃO DO TEMA
// ============================================================

atualizarIconeTema();
