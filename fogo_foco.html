<!DOCTYPE html>

    <meta charset="UTF-8">

    <style>

        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f6f8;

            color: #222;

           MAPA

            height: 650px;

        /* ======================================================
           PAINEL

            min-width: 280px;

        }


        .seletor-relatorio select:focus {

            padding: 20px;

            background: #f5f5f5;

            color: #666;

        .cabecalho-relatorio {

            padding: 20px;

        .cabecalho-relatorio h4 {

                0 0 10px 0;

            font-size: 23px;

        }


        .cabecalho-relatorio p {

        }


        /* ======================================================
           CARTÕES
        ====================================================== */

        .resumo-relatorio {

            display: flex;

        .cartao-resumo {

            flex: 1;

            min-width: 180px;

            padding: 18px;

            border:
                1px solid #ddd;

            border-radius: 8px;

            box-shadow:
                0 1px 4px rgba(0,0,0,0.08);

            color: #777;

        }


        .cartao-resumo .valor {

        /* ======================================================

        /* ======================================================

        .tabela-relatorio {

        .tabela-relatorio th {

        .tabela-relatorio td {

        /* ======================================================

<body>


<!-- ==========================================================
     MAPA
=========================================================== -->

<div id="mapa"></div>


<!-- ==========================================================
     RELATÓRIO
=========================================================== -->

<div id="painel-relatorio">

    <h3>
        Relatório
    </h3>


    <!-- ======================================================
         SELEÇÃO DA CAMADA
    ======================================================= -->

    <div class="seletor-relatorio">

        <label for="seletor-camada">

            Selecione a camada:

        </label>


        <select id="seletor-camada">

            <option value="">

                Selecione uma camada...

            </option>

            <option value="Estados">

                Estados

            </option>

            <option value="Biomas">

                Biomas

            </option>

            <option value="Terras Indígenas">

                Terras Indígenas

            </option>

            <option value="Unidades de Conservação">

                Unidades de Conservação

            </option>

        </select>

    </div>


    <!-- ======================================================
         SELEÇÃO DA ENTIDADE
    ======================================================= -->

    <div
        class="seletor-relatorio"
        id="container-entidade"
        style="display:none;"
    >

        <label for="seletor-entidade">

            Selecione:

        </label>


        <select id="seletor-entidade">

            <option value="">

                Selecione...

            </option>

        </select>

    </div>


    <!-- ======================================================
         CONTEÚDO
    ======================================================= -->

    <div
        id="conteudo-relatorio"
        class="mensagem-relatorio"

        Selecione uma camada para gerar o relatório.

    </div>

</div>



<script>


// ============================================================
// 1. MAPA
// ============================================================

const mapa = L.map("mapa").setView(

    [-14.2, -51.9],

    4

);


L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        attribution:
            "&copy; OpenStreetMap contributors",

        maxZoom: 18

    }

).addTo(mapa);



// ============================================================
// 2. ARQUIVOS
// ============================================================

const arquivosEstados = [

    "estados_2024_01.geojson",

    "estados_2024_02.geojson",

    "estados_2024_03.geojson"

];


const arquivosBiomas = [

    "biomas_2024_01.geojson",

    "biomas_2024_02.geojson",

    "biomas_2024_03.geojson",

    "biomas_2024_04.geojson",

    "biomas_2024_05.geojson"

];


const arquivosTI = [

    "terras_indigenas_2024_01.geojson",

    "terras_indigenas_2024_02.geojson",

    "terras_indigenas_2024_03.geojson",

    "terras_indigenas_2024_04.geojson"

];


const arquivosUC = [

    "unidades_conservacao_2024_01.geojson",

    "unidades_conservacao_2024_02.geojson",

    "unidades_conservacao_2024_03.geojson",

    "unidades_conservacao_2024_04.geojson"

];



// ============================================================
// 3. NORMALIZAR TEXTO
// ============================================================

function normalizarTexto(valor) {

    if (
        valor === null ||
        valor === undefined
    ) {

        return "";

    }


    return String(valor)

        .trim()

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        );

}



// ============================================================
// 4. VERIFICAR BRASIL
// ============================================================

function ehBrasil(feature) {

    const p =
        feature.properties || {};


    /*
       Procuramos dinamicamente o campo do país.

       Assim não dependemos de p.COUNTRY,
       que pode não existir em todos os arquivos.
    */

    const camposPais =
        Object.keys(p).filter(

            campo => {

                const campoNormalizado =
                    normalizarTexto(campo)
                        .replace(
                            /[^a-z0-9]/g,
                            ""
                        );


                return [

                    "country",

                    "pais",

                    "name0",

                    "countryname",

                    "nomepais",

                    "nomedopais"

                ].includes(
                    campoNormalizado
                );

            }

        );


    for (
        const campo of camposPais
    ) {

        const pais =
            normalizarTexto(
                p[campo]
            );


        if (

            pais === "brazil" ||

            pais === "brasil"

        ) {

            return true;

        }

    }


    return false;

}



// ============================================================
// 5. CARREGAR ARQUIVOS
// ============================================================

async function carregarArquivos(

    listaArquivos,

    somenteBrasil = false

) {

    let todasFeatures = [];


    for (

        const arquivo of listaArquivos

    ) {

        try {

            console.log(
                "Carregando:",
                arquivo
            );


            const resposta =
                await fetch(
                    arquivo
                );


            if (!resposta.ok) {

                throw new Error(

                    `Erro HTTP ${resposta.status}`

                );

            }


            const dados =
                await resposta.json();


            let features =
                dados.features || [];


            console.log(

                `${arquivo}: ${features.length} feições originais`

            );


            // ==================================================
            // FILTRO BRASIL
            // ==================================================

            if (somenteBrasil) {

                const totalAntes =
                    features.length;


                features =
                    features.filter(

                        feature =>
                            ehBrasil(feature)

                    );


                console.log(

                    `${arquivo}: ${features.length} feições brasileiras de ${totalAntes}`

                );

            }


            todasFeatures.push(
                ...features
            );


        }

        catch (erro) {

            console.error(

                `Erro ao carregar ${arquivo}:`,

                erro

            );

        }

    }


    // ========================================================
    // REMOVER DUPLICADOS
    // ========================================================

    /*
       Os arquivos dos Estados podem possuir
       os mesmos estados em mais de uma parte.

       Aqui usamos o nome do estado como chave.

       Resultado:
       São Paulo aparece uma vez,
       Minas Gerais aparece uma vez etc.
    */

    const mapaUnico =
        new Map();


    todasFeatures.forEach(

        feature => {

            const nome =
                normalizarTexto(
                    obterNome(feature)
                );


            if (!nome) {

                return;

            }


            if (
                !mapaUnico.has(nome)
            ) {

                mapaUnico.set(

                    nome,

                    feature

                );

            }

        }

    );


    const featuresUnicas =
        Array.from(
            mapaUnico.values()
        );


    console.log(

        "Total original:",

        todasFeatures.length

    );


    console.log(

        "Total após remover duplicados:",

        featuresUnicas.length

    );


    return {

        type: "FeatureCollection",

        features: featuresUnicas

    };

}



// ============================================================
// 6. RANKING
// ============================================================

function obterRanking(feature) {

    const p =
        feature.properties || {};


    const camposRanking = [

        "Rank_Category",

        "Burned Area Rank",

        "Burned_Area_Rank",

        "Ranking",

        "ranking",

        "Rank",

        "rank"

    ];


    for (

        const campo of camposRanking

    ) {

        if (

            p[campo] !== undefined &&

            p[campo] !== null &&

            p[campo] !== ""

        ) {

            const valor =
                Number(
                    p[campo]
                );


            if (
                Number.isFinite(valor)
            ) {

                return valor;

            }

        }

    }


    return null;

}



// ============================================================
// 7. NOME
// ============================================================

function obterNome(feature) {

    const p =
        feature.properties || {};


    const camposNome = [

        "region_nam",

        "reigon_nam",

        "Region Name",

        "NAME_1",

        "NM_ESTADO",

        "NM_UF",

        "NAME",

        "nome",

        "Nome",

        "name",

        "NAME_0",

        "Region"

    ];


    for (

        const campo of camposNome

    ) {

        if (

            p[campo] !== undefined &&

            p[campo] !== null &&

            String(p[campo]).trim() !== ""

        ) {

            return String(
                p[campo]
            );

        }

    }


    return "Sem nome";

}



// ============================================================
// 8. ÁREA QUEIMADA
// ============================================================

function obterArea(feature) {

    const p =
        feature.properties || {};


    const camposArea = [

        "Burned Area (km^2)",

        "Burned_Area_km2",

        "Burned Area",

        "burned_area",

        "area_queimada",

        "Area Queimada"

    ];


    for (

        const campo of camposArea

    ) {

        if (

            p[campo] !== undefined &&

            p[campo] !== null &&

            p[campo] !== ""

        ) {

            const valor =
                Number(
                    p[campo]
                );


            if (
                Number.isFinite(valor)
            ) {

                return valor;

            }

        }

    }


    return null;

}



// ============================================================
// 9. REGIÃO
// ============================================================

function obterRegiao(feature) {

    const p =
        feature.properties || {};


    const campos = [

        "region_des",

        "Region",

        "REGION",

        "region_name",

        "Region Name"

    ];


    for (
        const campo of campos
    ) {

        if (

            p[campo] !== undefined &&

            p[campo] !== null &&

            String(p[campo]).trim() !== ""

        ) {

            return String(
                p[campo]
            );

        }

    }


    return null;

}



// ============================================================
// 10. CORES
// ============================================================

function corRanking(rank) {

    if (
        rank === null ||
        rank === undefined
    ) {

        return "#cccccc";

    }


    rank =
        Number(rank);


    if (rank === 1)
        return "#7f0000";


    if (rank === 2)
        return "#b30000";


    if (rank === 3)
        return "#d7301f";


    if (rank === 4)
        return "#ef6548";


    if (rank === 5)
        return "#fdae61";


    if (
        rank >= 6 &&
        rank <= 18
    )

        return "#bdbdbd";


    if (rank === 19)
        return "#c6dbef";


    if (rank === 20)
        return "#9ecae1";


    if (rank === 21)
        return "#6baed6";


    if (rank === 22)
        return "#4292c6";


    if (rank === 23)
        return "#2171b5";


    if (rank === 24)
        return "#084594";


    return "#cccccc";

}



// ============================================================
// 11. ESTILO
// ============================================================

function estiloPorRanking(feature) {

    const rank =
        obterRanking(feature);


    return {

        fillColor:
            corRanking(rank),

        weight: 1,

        opacity: 1,

        color: "#555",

        fillOpacity: 0.75

    };

}



// ============================================================
// 12. ESCAPAR HTML
// ============================================================

function escaparHTML(valor) {

    if (
        valor === null ||
        valor === undefined
    ) {

        return "";

    }


    return String(valor)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ============================================================
// 13. FORMATAÇÃO
// ============================================================

function formatarValor(valor) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {

        return "Não disponível";

    }


    if (
        typeof valor === "number"
    ) {

        return valor.toLocaleString(

            "pt-BR",

            {

                maximumFractionDigits: 4

            }

        );

    }


    return String(valor);

}



// ============================================================
// 14. POPUP DO MAPA
// ============================================================

function popupRanking(

    feature,

    layer

) {

    const nome =
        obterNome(feature);


    const rank =
        obterRanking(feature);


    const area =
        obterArea(feature);


    let html = `

        <strong>
            ${escaparHTML(nome)}
        </strong>

        <br><br>

    `;


    if (
        rank !== null
    ) {

        html += `

            <b>Ranking:</b>
            ${rank}

            <br>

        `;

    }


    if (
        area !== null
    ) {

        html += `

            <b>Área queimada:</b>
            ${formatarValor(area)}
            km²

        `;

    }


    layer.bindPopup(
        html
    );

}



// ============================================================
// 15. GRUPOS
// ============================================================

const grupoEstados =
    L.layerGroup();


const grupoBiomas =
    L.layerGroup();


const grupoTI =
    L.layerGroup();


const grupoUC =
    L.layerGroup();



// ============================================================
// 16. DADOS
// ============================================================

let dadosEstados = null;

let dadosBiomas = null;

let dadosTI = null;

let dadosUC = null;



// ============================================================
// 17. CRIAR CAMADA
// ============================================================

function criarCamada(data) {

    return L.geoJSON(

        data,

        {

            style:
                estiloPorRanking,

            onEachFeature:
                popupRanking

        }

    );

}



// ============================================================
// 18. CARREGAR ESTADOS
// ============================================================

carregarArquivos(

    arquivosEstados,

    true

).then(

    data => {

        dadosEstados =
            data;


        const camada =
            criarCamada(data);


        camada.addTo(
            grupoEstados
        );


        console.log(

            "ESTADOS DO BRASIL:",

            data.features.length

        );

    }

);



// ============================================================
// 19. CARREGAR BIOMAS
// ============================================================

carregarArquivos(

    arquivosBiomas

).then(

    data => {

        dadosBiomas =
            data;


        const camada =
            criarCamada(data);


        camada.addTo(
            grupoBiomas
        );


        console.log(

            "BIOMAS:",

            data.features.length

        );

    }

);



// ============================================================
// 20. CARREGAR TERRAS INDÍGENAS
// ============================================================

carregarArquivos(

    arquivosTI

).then(

    data => {

        dadosTI =
            data;


        const camada =
            criarCamada(data);


        camada.addTo(
            grupoTI
        );


        console.log(

            "TERRAS INDÍGENAS:",

            data.features.length

        );

    }

);



// ============================================================
// 21. CARREGAR UNIDADES DE CONSERVAÇÃO
// ============================================================

carregarArquivos(

    arquivosUC

).then(

    data => {

        dadosUC =
            data;


        const camada =
            criarCamada(data);


        camada.addTo(
            grupoUC
        );


        console.log(

            "UNIDADES DE CONSERVAÇÃO:",

            data.features.length

        );

    }

);



// ============================================================
// 22. CONTROLE DE CAMADAS
// ============================================================

const controleCamadas = {

    "Estados":
        grupoEstados,

    "Biomas":
        grupoBiomas,

    "Terras Indígenas":
        grupoTI,

    "Unidades de Conservação":
        grupoUC

};


L.control.layers(

    null,

    controleCamadas,

    {

        collapsed: false

    }

).addTo(mapa);



// ============================================================
// 23. LEGENDA
// ============================================================

const legenda =
    L.control({

        position:
            "bottomright"

    });


legenda.onAdd =
    function() {

        const div =
            L.DomUtil.create(

                "div",

                "legenda-ranking"

            );


        div.innerHTML = `

            <strong>
                Ranking de Área Queimada
            </strong>

            <br>

            <div>
                <i style="background:#7f0000"></i>
                1
            </div>

            <div>
                <i style="background:#b30000"></i>
                2
            </div>

            <div>
                <i style="background:#d7301f"></i>
                3
            </div>

            <div>
                <i style="background:#ef6548"></i>
                4
            </div>

            <div>
                <i style="background:#fdae61"></i>
                5
            </div>

            <div>
                <i style="background:#bdbdbd"></i>
                6–18
            </div>

            <div>
                <i style="background:#c6dbef"></i>
                19
            </div>

            <div>
                <i style="background:#9ecae1"></i>
                20
            </div>

            <div>
                <i style="background:#6baed6"></i>
                21
            </div>

            <div>
                <i style="background:#4292c6"></i>
                22
            </div>

            <div>
                <i style="background:#2171b5"></i>
                23
            </div>

            <div>
                <i style="background:#084594"></i>
                24
            </div>

        `;


        return div;

    };


legenda.addTo(mapa);



// ============================================================
// 24. OBTER DADOS DA CAMADA
// ============================================================

function obterDadosDaCamada(

    nomeCamada

) {

    if (
        nomeCamada ===
        "Estados"
    )

        return dadosEstados;


    if (
        nomeCamada ===
        "Biomas"
    )

        return dadosBiomas;


    if (
        nomeCamada ===
        "Terras Indígenas"
    )

        return dadosTI;


    if (
        nomeCamada ===
        "Unidades de Conservação"
    )

        return dadosUC;


    return null;

}



// ============================================================
// 25. OBTER GRUPO DA CAMADA
// ============================================================

function obterGrupoDaCamada(

    nomeCamada

) {

    if (
        nomeCamada ===
        "Estados"
    )

        return grupoEstados;


    if (
        nomeCamada ===
        "Biomas"
    )

        return grupoBiomas;


    if (
        nomeCamada ===
        "Terras Indígenas"
    )

        return grupoTI;


    if (
        nomeCamada ===
        "Unidades de Conservação"
    )

        return grupoUC;


    return null;

}



// ============================================================
// 26. IDENTIFICADOR
// ============================================================

function obterIdentificador(

    feature

) {

    const p =
        feature.properties || {};


    const campos = [

        "terrai_cod",

        "Cnuc"

    ];


    for (
        const campo of campos
    ) {

        if (

            p[campo] !== undefined &&

            p[campo] !== null &&

            p[campo] !== ""

        ) {

            return String(
                p[campo]
            );

        }

    }


    return "";

}



// ============================================================
// 27. CAMADA TEM RELATÓRIO COMPLETO?
// ============================================================

function temRelatorioCompleto(

    nomeCamada

) {

    return (

        nomeCamada === "Estados" ||

        nomeCamada === "Biomas"

    );

}



// ============================================================
// 28. SELEÇÃO DA CAMADA
// ============================================================

document

    .getElementById(
        "seletor-camada"
    )

    .addEventListener(

        "change",

        function() {

            const nomeCamada =
                this.value;


            const seletorEntidade =
                document.getElementById(
                    "seletor-entidade"
                );


            const container =
                document.getElementById(
                    "container-entidade"
                );


            const conteudo =
                document.getElementById(
                    "conteudo-relatorio"
                );


            // --------------------------------------------------
            // LIMPAR
            // --------------------------------------------------

            seletorEntidade.innerHTML = `

                <option value="">

                    Selecione...

                </option>

            `;


            container.style.display =
                "none";


            conteudo.className =
                "mensagem-relatorio";


            conteudo.innerHTML = `

                Selecione uma camada
                para gerar o relatório.

            `;


            if (!nomeCamada) {

                return;

            }


            const dados =
                obterDadosDaCamada(
                    nomeCamada
                );


            // --------------------------------------------------
            // AINDA CARREGANDO
            // --------------------------------------------------

            if (!dados) {

                conteudo.innerHTML = `

                    Carregando os dados de
                    <strong>
                        ${escaparHTML(nomeCamada)}
                    </strong>...

                `;

                return;

            }


            if (

                !dados.features ||

                dados.features.length === 0

            ) {

                conteudo.innerHTML = `

                    Não existem dados disponíveis
                    para esta camada.

                `;

                return;

            }


            // --------------------------------------------------
            // MOSTRAR CAMADA NO MAPA
            // --------------------------------------------------

            const grupo =
                obterGrupoDaCamada(
                    nomeCamada
                );


            if (

                grupo &&

                !mapa.hasLayer(grupo)

            ) {

                grupo.addTo(mapa);

            }


            // --------------------------------------------------
            // CRIAR LISTA DE NOMES
            // --------------------------------------------------

            const entidades = [];


            dados.features.forEach(

                (

                    feature,

                    index

                ) => {

                    entidades.push({

                        index:
                            index,

                        nome:
                            obterNome(
                                feature
                            ),

                        identificador:
                            obterIdentificador(
                                feature
                            )

                    });

                }

            );


            // --------------------------------------------------
            // CONTAGEM DE NOMES
            // --------------------------------------------------

            const contagemNomes = {};


            entidades.forEach(

                entidade => {

                    const chave =
                        normalizarTexto(
                            entidade.nome
                        );


                    if (
                        !contagemNomes[chave]
                    ) {

                        contagemNomes[chave] =
                            0;

                    }


                    contagemNomes[chave]++;

                }

            );


            // --------------------------------------------------
            // ORDENAR ALFABETICAMENTE
            // --------------------------------------------------

            entidades.sort(

                (a, b) => {

                    return a.nome.localeCompare(

                        b.nome,

                        "pt-BR",

                        {

                            sensitivity:
                                "base"

                        }

                    );

                }

            );


            // --------------------------------------------------
            // PREENCHER SELETOR
            // --------------------------------------------------

            entidades.forEach(

                entidade => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        entidade.index;


                    let texto =
                        entidade.nome;


                    /*
                       Para Estados e Biomas,
                       mostrar somente o nome.

                       Para TI e UC, se houver nomes
                       duplicados, acrescentar o código.
                    */

                    if (

                        (

                            nomeCamada ===
                            "Terras Indígenas" ||

                            nomeCamada ===
                            "Unidades de Conservação"

                        ) &&

                        contagemNomes[
                            normalizarTexto(
                                entidade.nome
                            )
                        ] > 1

                    ) {

                        if (
                            entidade.identificador
                        ) {

                            texto +=
                                ` — ${entidade.identificador}`;

                        }

                    }


                    option.textContent =
                        texto;


                    seletorEntidade
                        .appendChild(
                            option
                        );

                }

            );


            container.style.display =
                "flex";


            // --------------------------------------------------
            // MENSAGEM
            // --------------------------------------------------

            if (
                temRelatorioCompleto(
                    nomeCamada
                )
            ) {

                conteudo.innerHTML = `

                    Agora selecione
                    o item que deseja consultar.

                `;

            }

            else {

                conteudo.innerHTML = `

                    Selecione uma área para
                    visualizar o ranking.

                `;

            }

        }

    );



// ============================================================
// 29. SELEÇÃO DA ENTIDADE
// ============================================================

document

    .getElementById(
        "seletor-entidade"
    )

    .addEventListener(

        "change",

        function() {

            const nomeCamada =

                document

                    .getElementById(
                        "seletor-camada"
                    )

                    .value;


            if (
                this.value === ""
            ) {

                return;

            }


            const indice =
                Number(
                    this.value
                );


            const conteudo =
                document.getElementById(
                    "conteudo-relatorio"
                );


            const dados =
                obterDadosDaCamada(
                    nomeCamada
                );


            if (

                !dados ||

                !dados.features[indice]

            ) {

                conteudo.innerHTML = `

                    Não foi possível localizar
                    o item selecionado.

                `;

                return;

            }


            const feature =
                dados.features[indice];


            // ==================================================
            // TI E UC
            // ==================================================

            if (
                !temRelatorioCompleto(
                    nomeCamada
                )
            ) {

                gerarRelatorioSimplificado(

                    feature,

                    nomeCamada

                );

            }


            // ==================================================
            // ESTADOS E BIOMAS
            // ==================================================

            else {

                gerarRelatorio(

                    feature,

                    nomeCamada

                );

            }


            // --------------------------------------------------
            // CENTRALIZAR
            // --------------------------------------------------

            try {

                const geo =
                    L.geoJSON(
                        feature
                    );


                const bounds =
                    geo.getBounds();


                if (

                    bounds &&

                    bounds.isValid()

                ) {

                    mapa.fitBounds(

                        bounds,

                        {

                            padding:
                                [30, 30],

                            maxZoom:
                                8

                        }

                    );

                }

            }

            catch (erro) {

                console.warn(

                    "Não foi possível centralizar:",

                    erro

                );

            }

        }

    );



// ============================================================
// 30. RELATÓRIO SIMPLIFICADO
// ============================================================

function gerarRelatorioSimplificado(

    feature,

    nomeCamada

) {

    const conteudo =
        document.getElementById(
            "conteudo-relatorio"
        );


    const nome =
        obterNome(feature);


    const rank =
        obterRanking(feature);


    let rankingHTML =
        "Não disponível";


    if (
        rank !== null
    ) {

        let classe =
            "ranking-6-18";


        if (

            rank >= 1 &&

            rank <= 5

        ) {

            classe =
                `ranking-${rank}`;

        }


        else if (

            rank >= 19 &&

            rank <= 24

        ) {

            classe =
                `ranking-${rank}`;

        }


        rankingHTML = `

            <span
                class="
                    ranking
                    ${classe}
                "
            >

                ${rank}

            </span>

        `;

    }


    conteudo.className = "";


    conteudo.innerHTML = `

        <div class="cabecalho-relatorio">

            <h4>

                ${escaparHTML(nome)}

            </h4>

            <p>

                <strong>Camada:</strong>

                ${escaparHTML(nomeCamada)}

            </p>

        </div>


        <div class="resumo-relatorio">

            <div class="cartao-resumo">

                <div class="titulo">

                    Área selecionada

                </div>

                <div class="valor">

                    ${escaparHTML(nome)}

                </div>

            </div>


            <div class="cartao-resumo">

                <div class="titulo">

                    Ranking

                </div>

                <div class="valor">

                    ${rankingHTML}

                </div>

            </div>

        </div>


        <div class="aviso-sem-dados">

            <strong>
                Dados adicionais:
            </strong>

            <br><br>

            Não há dados adicionais disponíveis
            para esta camada além do ranking.

        </div>

    `;

}



// ============================================================
// 31. RELATÓRIO COMPLETO
// ============================================================

function gerarRelatorio(

    feature,

    nomeCamada

) {

    const conteudo =
        document.getElementById(
            "conteudo-relatorio"
        );


    const nome =
        obterNome(feature);


    const rank =
        obterRanking(feature);


    const area =
        obterArea(feature);


    const regiao =
        obterRegiao(feature);


    // ========================================================
    // CABEÇALHO
    // ========================================================

    let html = `

        <div class="cabecalho-relatorio">

            <h4>

                ${escaparHTML(nome)}

            </h4>


            <p>

                <strong>Camada:</strong>

                ${escaparHTML(nomeCamada)}

            </p>

        </div>

    `;


    // ========================================================
    // CARTÕES
    // ========================================================

    html += `

        <div class="resumo-relatorio">

    `;


    // --------------------------------------------------------
    // NOME
    // --------------------------------------------------------

    html += `

        <div class="cartao-resumo">

            <div class="titulo">

                Área selecionada

            </div>

            <div class="valor">

            </div>

        </div>

    `;


    // --------------------------------------------------------
    // RANKING
    // --------------------------------------------------------

    if (

    ) {

        let classeRanking =
            "ranking-6-18";


        if (

            rank >= 1 &&

            rank <= 5

        ) {

            classeRanking =
                `ranking-${rank}`;

        }


        else if (

            rank >= 19 &&

            rank <= 24

        ) {

            classeRanking =

        }


        html += `

            <div class="cartao-resumo">

                <div class="titulo">

                    Ranking

                </div>

                <div class="valor">

                    <span
                        class="
                            ranking
                            ${classeRanking}
                        "
                    >

                        ${rank}

                </div>

            </div>

        `;

    }


    // --------------------------------------------------------
    // ÁREA
    // --------------------------------------------------------

    if (
        area !== null
    ) {

        html += `

            <div class="cartao-resumo">

                <div class="titulo">

                    Área queimada

                </div>

                <div class="valor">

                    ${formatarValor(area)}
                    km²

                </div>

            </div>

        `;

    }


    html += `

        </div>

    `;


    // ========================================================
    // INFORMAÇÕES
    // ========================================================

    html += `

        <h4
            style="
                margin-top:30px;
                margin-bottom:10px;
            "
        >

            Informações

        </h4>


        <table
            class="tabela-relatorio"
        >

            <tbody>

    `;


    // --------------------------------------------------------
    // NOME
    // --------------------------------------------------------

    html += `

        <tr>

            <th>

                Nome

            </th>

            <td>

                ${escaparHTML(nome)}

            </td>

        </tr>

    `;


    // --------------------------------------------------------
    // RANKING
    // --------------------------------------------------------

    if (
        rank !== null
    ) {

        html += `

            <tr>

                <th>

                    Ranking

                </th>

                <td>

                    ${rank}

                </td>

            </tr>

        `;

    }


    // --------------------------------------------------------
    // ÁREA
    // --------------------------------------------------------

    if (
        area !== null
    ) {

        html += `

            <tr>

                <th>

                    Área queimada

                </th>

                <td>

                    ${formatarValor(area)}
                    km²

                </td>

            </tr>

        `;

    }


    // --------------------------------------------------------
    // REGIÃO
    // --------------------------------------------------------

    if (
        regiao !== null
    ) {

        html += `

            <tr>

                <th>

                    Região

                </th>

                <td>

                    ${escaparHTML(regiao)}

                </td>

            </tr>

        `;

    }


    html += `

            </tbody>

        </table>

    `;


    // ========================================================
    // GRÁFICO
    // ========================================================

    if (
        area !== null
    ) {

        html += `

            <div id="area-grafico">

                <h4>

                    Área Queimada

                </h4>

                <canvas
                    id="grafico-area"
                ></canvas>

            </div>

        `;

    }


    conteudo.className = "";


    conteudo.innerHTML =

    // ========================================================
    // GRÁFICO
    // ========================================================

    if (
        area !== null
    ) {

        );

    }

}



// ============================================================
// 32. GRÁFICO
// ============================================================

function criarGraficoArea(

    nome,

    area,

    rank

) {

    const canvas =
        document.getElementById(
            "grafico-area"
        );


    if (!canvas) {

        return;

    }


    const ctx =
        canvas.getContext(
            "2d"
        );


    const largura =
        canvas.clientWidth ||
        800;


    const altura =
        canvas.clientHeight ||
        300;


    canvas.width =
        largura;


    canvas.height =
        altura;


    const margemEsquerda = 80;

    const margemDireita = 30;

    const margemSuperior = 40;

    const margemInferior = 60;


    const larguraGrafico =

        largura -

        margemEsquerda -

        margemDireita;


    const alturaGrafico =

        altura -

        margemSuperior -

        margemInferior;


    ctx.clearRect(

        0,

        0,

        largura,

        altura

    );


    const maximo =
        area > 0
            ? area
            : 1;


    // ========================================================
    // EIXOS
    // ========================================================

    ctx.beginPath();


    ctx.moveTo(

        margemEsquerda,

        margemSuperior

    );


    ctx.lineTo(

        margemEsquerda,

        margemSuperior +
        alturaGrafico

    );


    ctx.lineTo(

        margemEsquerda +
        larguraGrafico,

        margemSuperior +
        alturaGrafico

    );


    ctx.strokeStyle =
        "#777";


    ctx.lineWidth = 1;


    ctx.stroke();


    // ========================================================
    // BARRA
    // ========================================================

    const larguraBarra =
        Math.min(

            180,

            larguraGrafico * 0.4

        );


    const alturaBarra =

        (

            area /

            maximo

        ) *

        alturaGrafico;


    const x =

        margemEsquerda +

        (

            larguraGrafico -

            larguraBarra

        ) / 2;


    const y =

        margemSuperior +

        alturaGrafico -

        alturaBarra;


    let corBarra =
        "#777";


    if (
        rank !== null
    ) {

        corBarra =
            corRanking(rank);

    }


    ctx.fillStyle =
        corBarra;


    ctx.fillRect(

        x,

        y,

        larguraBarra,

        alturaBarra

    );


    // ========================================================
    // VALOR
    // ========================================================

    ctx.fillStyle =
        "#222";


    ctx.font =
        "bold 15px Arial";


    ctx.textAlign =
        "center";


    ctx.fillText(

        `${formatarValor(area)} km²`,

        x +
        larguraBarra / 2,

        Math.max(
            y - 10,
            20
        )

    );


    // ========================================================
    // NOME
    // ========================================================

    ctx.font =
        "14px Arial";


    ctx.fillText(

        nome.length > 25

            ? nome.substring(
                0,
                25
            ) + "..."

            : nome,

        x +
        larguraBarra / 2,

        margemSuperior +
        alturaGrafico +
        30

    );

}
