<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <title>Ranking de Área Queimada 2024/2025</title>


  <!-- ===================================================== -->
  <!-- LEAFLET -->
  <!-- ===================================================== -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <!-- ===================================================== -->
  <!-- ESTILO -->
  <!-- ===================================================== -->

  <style>

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f5f5f5;

    }


    h2 {

      margin: 20px;

    }


    #mapa {

      width: 100%;

      height: 700px;

    }


    /* ===================================================== */
    /* LEGENDA */
    /* ===================================================== */

    .legenda-ranking {

      background: white;

      padding: 12px;

      border-radius: 8px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.25);

      line-height: 18px;

      font-size: 12px;

    }


    .legenda-ranking h4 {

      margin:
        0 0 8px 0;

      font-size: 14px;

    }


    .item-legenda {

      display: flex;

      align-items: center;

      margin: 3px 0;

    }


    .cor-legenda {

      width: 22px;

      height: 14px;

      margin-right: 7px;

      border: 1px solid #777;

    }

  </style>

</head>


<body>


<h2>
  Ranking de Área Queimada 2024/2025
</h2>


<!-- ===================================================== -->
<!-- MAPA -->
<!-- ===================================================== -->

<div id="mapa"></div>


<script>


// ============================================================
// 1. MAPA
// ============================================================

const mapa = L.map("mapa").setView(

  [-14.2, -51.9],

  4

);


// ============================================================
// 2. MAPA BASE
// ============================================================

L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    attribution:
      "&copy; OpenStreetMap contributors"

  }

).addTo(mapa);


// ============================================================
// 3. ARQUIVOS DOS ESTADOS
// ============================================================

const arquivosEstados = [

  "estados_2024_01.geojson",

  "estados_2024_02.geojson",

  "estados_2024_03.geojson"

];


// ============================================================
// 4. ARQUIVOS DOS BIOMAS
// ============================================================

const arquivosBiomas = [

  "biomas_2024_01.geojson",

  "biomas_2024_02.geojson",

  "biomas_2024_03.geojson",

  "biomas_2024_04.geojson",

  "biomas_2024_05.geojson"

];


// ============================================================
// 5. ARQUIVOS DAS TERRAS INDÍGENAS
// ============================================================

const arquivosTI = [

  "terras_indigenas_2024_01.geojson",

  "terras_indigenas_2024_02.geojson",

  "terras_indigenas_2024_03.geojson",

  "terras_indigenas_2024_04.geojson"

];


// ============================================================
// 6. ARQUIVOS DAS UNIDADES DE CONSERVAÇÃO
// ============================================================

const arquivosUC = [

  "unidades_conservacao_2024_01.geojson",

  "unidades_conservacao_2024_02.geojson",

  "unidades_conservacao_2024_03.geojson",

  "unidades_conservacao_2024_04.geojson"

];


// ============================================================
// 7. FUNÇÃO ROBUSTA PARA CARREGAR OS ARQUIVOS
// ============================================================

async function carregarArquivos(

  listaArquivos,

  nomeCamada

) {


  console.log("");

  console.log(
    "======================================"
  );

  console.log(
    "CARREGANDO:",
    nomeCamada
  );

  console.log(
    "======================================"
  );


  let features = [];


  // ----------------------------------------------------------
  // CARREGAR UM ARQUIVO POR VEZ
  // ----------------------------------------------------------

  for (

    const arquivo of listaArquivos

  ) {


    try {


      console.log(
        "Tentando:",
        arquivo
      );


      const response =

        await fetch(arquivo);


      console.log(

        arquivo,

        "Status:",

        response.status

      );


      // ------------------------------------------------------
      // VERIFICAR HTTP
      // ------------------------------------------------------

      if (!response.ok) {

        throw new Error(

          "HTTP " +

          response.status

        );

      }


      // ------------------------------------------------------
      // LER JSON
      // ------------------------------------------------------

      const geojson =

        await response.json();


      // ------------------------------------------------------
      // VERIFICAR GEOJSON
      // ------------------------------------------------------

      if (

        !geojson ||

        !Array.isArray(
          geojson.features
        )

      ) {

        throw new Error(

          "Arquivo não possui uma coleção GeoJSON válida."

        );

      }


      // ------------------------------------------------------
      // ADICIONAR FEATURES
      // ------------------------------------------------------

      features =

        features.concat(

          geojson.features

        );


      console.log(

        "OK:",

        arquivo,

        "→",

        geojson.features.length,

        "feições"

      );


    }

    catch (erro) {


      console.error(

        "ERRO:",

        arquivo

      );


      console.error(

        erro

      );

    }

  }


  // ==========================================================
  // RESULTADO FINAL
  // ==========================================================

  const resultadoFinal = {

    type:
      "FeatureCollection",

    features:
      features

  };


  console.log("");

  console.log(

    "RESULTADO:",

    nomeCamada

  );


  console.log(

    "Total de feições carregadas:",

    features.length

  );


  console.log("");

  return resultadoFinal;

}


// ============================================================
// 8. FUNÇÃO PARA OBTER O RANKING
// ============================================================

function obterRanking(feature) {


  const p =

    feature.properties || {};


  // ----------------------------------------------------------
  // Campo principal
  // ----------------------------------------------------------

  if (

    p["Burned Area Rank"] !== undefined &&

    p["Burned Area Rank"] !== null

  ) {

    return Number(

      p["Burned Area Rank"]

    );

  }


  // ----------------------------------------------------------
  // Outras possibilidades
  // ----------------------------------------------------------

  const possibilidades = [

    "Burned_Area_Rank",

    "Burned Area Rank ",

    "burned_area_rank",

    "Rank",

    "rank",

    "Ranking",

    "ranking"

  ];


  for (

    const campo of possibilidades

  ) {


    if (

      p[campo] !== undefined &&

      p[campo] !== null

    ) {

      return Number(

        p[campo]

      );

    }

  }


  // ----------------------------------------------------------
  // Não encontrado
  // ----------------------------------------------------------

  return null;

}


// ============================================================
// 9. ESCALA DE CORES
// ============================================================

function corRanking(rank) {


  const r = Number(rank);


  // ----------------------------------------------------------
  // SEM RANKING
  // ----------------------------------------------------------

  if (

    !Number.isFinite(r)

  ) {

    return "#ffffff";

  }


  // ==========================================================
  // 1º A 5º
  // VERMELHO → AMARELO
  // ==========================================================

  if (r === 1) {

    return "#7f0000";

  }


  if (r === 2) {

    return "#b30000";

  }


  if (r === 3) {

    return "#d7301f";

  }


  if (r === 4) {

    return "#ef6548";

  }


  if (r === 5) {

    return "#fdae61";

  }


  // ==========================================================
  // 6º A 18º
  // CINZA
  // ==========================================================

  if (

    r >= 6 &&

    r <= 18

  ) {

    return "#bdbdbd";

  }


  // ==========================================================
  // 19º A 24º
  // AZUL CLARO → AZUL ESCURO
  // ==========================================================

  if (r === 19) {

    return "#c6dbef";

  }


  if (r === 20) {

    return "#9ecae1";

  }


  if (r === 21) {

    return "#6baed6";

  }


  if (r === 22) {

    return "#4292c6";

  }


  if (r === 23) {

    return "#2171b5";

  }


  if (r === 24) {

    return "#084594";

  }


  // ----------------------------------------------------------
  // FORA DA ESCALA
  // ----------------------------------------------------------

  return "#ffffff";

}


// ============================================================
// 10. ESTILO DAS FEIÇÕES
// ============================================================

function estiloPorRanking(feature) {


  const rank =

    obterRanking(feature);


  const cor =

    corRanking(rank);


  return {

    color: "#555555",

    weight: 1,

    fillColor: cor,

    fillOpacity: 0.70

  };

}


// ============================================================
// 11. NOME DA REGIÃO
// ============================================================

function obterNome(feature) {


  const p =

    feature.properties || {};


  const campos = [

    "Region Name",

    "region_nam",

    "NAME_1",

    "NM_ESTADO",

    "NM_UF",

    "NAME",

    "nome",

    "Nome",

    "name",

    "NAME_0",

    "Region"

  ];


  for (

    const campo of campos

  ) {


    if (

      p[campo] !== undefined &&

      p[campo] !== null &&

      p[campo] !== ""

    ) {

      return p[campo];

    }

  }


  return "Região";

}


// ============================================================
// 12. POPUP
// ============================================================

function popupRanking(

  feature,

  layer

) {


  const p =

    feature.properties || {};


  const nome =

    obterNome(feature);


  const rank =

    obterRanking(feature);


  const area =

    p["Burned Area (km^2)"];


  let texto =

    "<strong>" +

    nome +

    "</strong><br><br>";


  // ----------------------------------------------------------
  // RANKING
  // ----------------------------------------------------------

  if (

    Number.isFinite(rank)

  ) {

    texto +=

      "<strong>Ranking:</strong> " +

      rank +

      "º<br>";

  }


  // ----------------------------------------------------------
  // ÁREA
  // ----------------------------------------------------------

  if (

    area !== undefined &&

    area !== null

  ) {


    const areaNumero =

      Number(area);


    if (

      Number.isFinite(

        areaNumero

      )

    ) {


      texto +=

        "<strong>Área queimada:</strong> " +

        areaNumero.toLocaleString(

          "pt-BR",

          {

            maximumFractionDigits: 2

          }

        ) +

        " km²";

    }

  }


  layer.bindPopup(

    texto

  );

}


// ============================================================
// 13. GRUPOS DAS CAMADAS
// ============================================================

const grupoEstados =

  L.layerGroup();


const grupoBiomas =

  L.layerGroup();


const grupoTI =

  L.layerGroup();


const grupoUC =

  L.layerGroup();


// ============================================================
// 14. DADOS
// ============================================================

let dadosEstados = null;

let dadosBiomas = null;

let dadosTI = null;

let dadosUC = null;


// ============================================================
// 15. ESTADOS
// ============================================================

carregarArquivos(

  arquivosEstados,

  "Estados"

)

.then(data => {


  dadosEstados = data;


  const camada =

    L.geoJSON(

      data,

      {

        style:
          estiloPorRanking,

        onEachFeature:
          popupRanking

      }

    );


  grupoEstados.addLayer(

    camada

  );


  console.log(

    "✓ ESTADOS PRONTOS"

  );

})

.catch(error => {

  console.error(

    "Erro geral nos estados:",

    error

  );

});


// ============================================================
// 16. BIOMAS
// ============================================================

carregarArquivos(

  arquivosBiomas,

  "Biomas"

)

.then(data => {


  dadosBiomas = data;


  const camada =

    L.geoJSON(

      data,

      {

        style:
          estiloPorRanking,

        onEachFeature:
          popupRanking

      }

    );


  grupoBiomas.addLayer(

    camada

  );


  console.log(

    "✓ BIOMAS PRONTOS"

  );

})

.catch(error => {

  console.error(

    "Erro geral nos biomas:",

    error

  );

});


// ============================================================
// 17. TERRAS INDÍGENAS
// ============================================================

carregarArquivos(

  arquivosTI,

  "Terras Indígenas"

)

.then(data => {


  dadosTI = data;


  const camada =

    L.geoJSON(

      data,

      {

        style:
          estiloPorRanking,

        onEachFeature:
          popupRanking

      }

    );


  grupoTI.addLayer(

    camada

  );


  console.log(

    "✓ TERRAS INDÍGENAS PRONTAS"

  );

})

.catch(error => {

  console.error(

    "Erro geral nas Terras Indígenas:",

    error

  );

});


// ============================================================
// 18. UNIDADES DE CONSERVAÇÃO
// ============================================================

carregarArquivos(

  arquivosUC,

  "Unidades de Conservação"

)

.then(data => {


  dadosUC = data;


  const camada =

    L.geoJSON(

      data,

      {

        style:
          estiloPorRanking,

        onEachFeature:
          popupRanking

      }

    );


  grupoUC.addLayer(

    camada

  );


  console.log(

    "✓ UNIDADES DE CONSERVAÇÃO PRONTAS"

  );

})

.catch(error => {

  console.error(

    "Erro geral nas Unidades de Conservação:",

    error

  );

});


// ============================================================
// 19. CONTROLE DE CAMADAS
// ============================================================

const controleCamadas = {


  "Estados":

    grupoEstados,


  "Biomas":

    grupoBiomas,


  "Terras Indígenas":

    grupoTI,


  "Unidades de Conservação":

    grupoUC

};


// ============================================================
// 20. ADICIONAR CONTROLE
// ============================================================

L.control.layers(

  null,

  controleCamadas,

  {

    collapsed: false

  }

).addTo(mapa);


// ============================================================
// 21. LEGENDA
// ============================================================

const legenda =

  L.control({

    position:
      "bottomright"

  });


legenda.onAdd =

  function() {


    const div =

      L.DomUtil.create(

        "div",

        "legenda-ranking"

      );


    div.innerHTML =

      "<h4>Ranking de área queimada</h4>";


    div.innerHTML +=

      itemLegenda(

        "#7f0000",

        "1º"

      );


    div.innerHTML +=

      itemLegenda(

        "#b30000",

        "2º"

      );


    div.innerHTML +=

      itemLegenda(

        "#d7301f",

        "3º"

      );


    div.innerHTML +=

      itemLegenda(

        "#ef6548",

        "4º"

      );


    div.innerHTML +=

      itemLegenda(

        "#fdae61",

        "5º"

      );


    div.innerHTML +=

      itemLegenda(

        "#bdbdbd",

        "6º–18º"

      );


    div.innerHTML +=

      itemLegenda(

        "#c6dbef",

        "19º"

      );


    div.innerHTML +=

      itemLegenda(

        "#9ecae1",

        "20º"

      );


    div.innerHTML +=

      itemLegenda(

        "#6baed6",

        "21º"

      );


    div.innerHTML +=

      itemLegenda(

        "#4292c6",

        "22º"

      );


    div.innerHTML +=

      itemLegenda(

        "#2171b5",

        "23º"

      );


    div.innerHTML +=

      itemLegenda(

        "#084594",

        "24º"

      );


    return div;

  };


// ============================================================
// 22. ITEM DA LEGENDA
// ============================================================

function itemLegenda(

  cor,

  texto

) {


  return `

    <div class="item-legenda">

      <span

        class="cor-legenda"

        style="background:${cor};">

      </span>

      <span>

        ${texto}

      </span>

    </div>

  `;

}


// ============================================================
// 23. ADICIONAR LEGENDA
// ============================================================

legenda.addTo(mapa);


// ============================================================
// 24. INÍCIO
// ============================================================

console.log("");

console.log(

  "=========================================="

);

console.log(

  "DASHBOARD DE FOGO"

);

console.log(

  "Carregando Regional Layers..."

);

console.log(

  "=========================================="

);

</script>


</body>

</html>
