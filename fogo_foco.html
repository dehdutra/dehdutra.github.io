<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard de Área Queimada</title>


    <!-- ==========================================================
         LEAFLET
    =========================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- ==========================================================
         ESTILO
    =========================================================== -->

    <style>

        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f6f8;

            color: #222;

        }


        /* ======================================================
           MAPA
        ====================================================== */

        #mapa {

            width: 100%;

            height: 650px;

            border-bottom:
                1px solid #ccc;

        }


        /* ======================================================
           PAINEL DE RELATÓRIO
        ====================================================== */

        #painel-relatorio {

            width: 100%;

            box-sizing: border-box;

            padding: 25px;

            background: white;

            border-top:
                1px solid #ddd;

        }


        #painel-relatorio h3 {

            margin-top: 0;

            margin-bottom: 20px;

            font-size: 22px;

        }


        /* ======================================================
           SELETORES
        ====================================================== */

        .seletor-relatorio {

            display: flex;

            flex-wrap: wrap;

            gap: 15px;

            margin-bottom: 15px;

            align-items: center;

        }


        .seletor-relatorio label {

            font-weight: bold;

        }


        .seletor-relatorio select {

            min-width: 280px;

            padding: 10px;

            border:
                1px solid #bbb;

            border-radius: 5px;

            background: white;

            font-size: 14px;

        }


        .seletor-relatorio select:focus {

            outline: none;

            border-color: #555;

        }


        /* ======================================================
           MENSAGEM
        ====================================================== */

        .mensagem-relatorio {

            padding: 20px;

            background: #f5f5f5;

            border-radius: 6px;

            color: #666;

            margin-top: 20px;

        }


        /* ======================================================
           CABEÇALHO DO RELATÓRIO
        ====================================================== */

        .cabecalho-relatorio {

            margin-top: 25px;

            padding: 20px;

            border-radius: 8px;

            background: #f5f5f5;

            border-left:
                6px solid #555;

        }


        .cabecalho-relatorio h4 {

            margin:
                0 0 10px 0;

            font-size: 23px;

        }


        .cabecalho-relatorio p {

            margin: 5px 0;

        }


        /* ======================================================
           CARTÕES
        ====================================================== */

        .resumo-relatorio {

            display: flex;

            flex-wrap: wrap;

            gap: 15px;

            margin-top: 20px;

        }


        .cartao-resumo {

            flex: 1;

            min-width: 180px;

            padding: 18px;

            background: white;

            border:
                1px solid #ddd;

            border-radius: 8px;

            box-shadow:
                0 1px 4px rgba(0,0,0,0.08);

        }


        .cartao-resumo .titulo {

            font-size: 13px;

            color: #777;

            margin-bottom: 8px;

        }


        .cartao-resumo .valor {

            font-size: 21px;

            font-weight: bold;

        }


        /* ======================================================
           RANKING
        ====================================================== */

        .ranking {

            display: inline-block;

            padding: 6px 12px;

            border-radius: 5px;

            font-weight: bold;

            color: white;

        }


        .ranking-1,
        .ranking-2,
        .ranking-3 {

            background: #b30000;

        }


        .ranking-4,
        .ranking-5 {

            background: #ef6548;

        }


        .ranking-6-18 {

            background: #999;

        }


        .ranking-19,
        .ranking-20 {

            background: #9ecae1;

            color: #222;

        }


        .ranking-21,
        .ranking-22 {

            background: #4292c6;

        }


        .ranking-23,
        .ranking-24 {

            background: #084594;

        }


        /* ======================================================
           TABELA
        ====================================================== */

        .tabela-relatorio {

            width: 100%;

            border-collapse:
                collapse;

            margin-top: 25px;

            background: white;

        }


        .tabela-relatorio th {

            text-align: left;

            padding: 12px;

            background: #eeeeee;

            border:
                1px solid #ddd;

            width: 35%;

        }


        .tabela-relatorio td {

            padding: 12px;

            border:
                1px solid #ddd;

            word-break: break-word;

        }


        .tabela-relatorio tr:hover {

            background: #f8f8f8;

        }


        /* ======================================================
           GRÁFICO
        ====================================================== */

        #area-grafico {

            margin-top: 30px;

            padding: 20px;

            background: white;

            border:
                1px solid #ddd;

            border-radius: 8px;

        }


        #area-grafico h4 {

            margin-top: 0;

        }


        #grafico-area {

            width: 100%;

            max-width: 850px;

            height: 300px;

        }


        /* ======================================================
           LEGENDA
        ====================================================== */

        .legenda-ranking {

            background: white;

            padding: 12px;

            line-height: 18px;

            color: #333;

            box-shadow:
                0 0 8px rgba(0,0,0,0.2);

            border-radius: 5px;

        }


        .legenda-ranking div {

            display: flex;

            align-items: center;

        }


        .legenda-ranking i {

            width: 18px;

            height: 18px;

            margin-right: 7px;

            display: inline-block;

        }


        /* ======================================================
           RESPONSIVO
        ====================================================== */

        @media(max-width: 700px) {

            #mapa {

                height: 500px;

            }


            .seletor-relatorio {

                flex-direction: column;

                align-items: flex-start;

            }


            .seletor-relatorio select {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<!-- ==========================================================
     MAPA
=========================================================== -->

<div id="mapa"></div>


<!-- ==========================================================
     RELATÓRIO
=========================================================== -->

<div id="painel-relatorio">

    <h3>
        Relatório
    </h3>


    <!-- ======================================================
         SELEÇÃO DA CAMADA
    ======================================================= -->

    <div class="seletor-relatorio">

        <label for="seletor-camada">

            Selecione a camada:

        </label>


        <select id="seletor-camada">

            <option value="">

                Selecione uma camada...

            </option>

            <option value="Estados">

                Estados

            </option>

            <option value="Biomas">

                Biomas

            </option>

            <option value="Terras Indígenas">

                Terras Indígenas

            </option>

            <option value="Unidades de Conservação">

                Unidades de Conservação

            </option>

        </select>

    </div>


    <!-- ======================================================
         SELEÇÃO DA ENTIDADE
    ======================================================= -->

    <div
        class="seletor-relatorio"
        id="container-entidade"
        style="display:none;"
    >

        <label for="seletor-entidade">

            Selecione:

        </label>


        <select id="seletor-entidade">

            <option value="">

                Selecione...

            </option>

        </select>

    </div>


    <!-- ======================================================
         CONTEÚDO DO RELATÓRIO
    ======================================================= -->

    <div
        id="conteudo-relatorio"
        class="mensagem-relatorio"
    >

        Selecione uma camada para gerar o relatório.

    </div>

</div>



<script>


// ============================================================
// 1. MAPA
// ============================================================

const mapa = L.map("mapa").setView(

    [-14.2, -51.9],

    4

);


L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        attribution:
            "&copy; OpenStreetMap contributors",

        maxZoom: 18

    }

).addTo(mapa);



// ============================================================
// 2. ARQUIVOS
// ============================================================

const arquivosEstados = [

    "estados_2024_01.geojson",

    "estados_2024_02.geojson",

    "estados_2024_03.geojson"

];


const arquivosBiomas = [

    "biomas_2024_01.geojson",

    "biomas_2024_02.geojson",

    "biomas_2024_03.geojson",

    "biomas_2024_04.geojson",

    "biomas_2024_05.geojson"

];


const arquivosTI = [

    "terras_indigenas_2024_01.geojson",

    "terras_indigenas_2024_02.geojson",

    "terras_indigenas_2024_03.geojson",

    "terras_indigenas_2024_04.geojson"

];


const arquivosUC = [

    "unidades_conservacao_2024_01.geojson",

    "unidades_conservacao_2024_02.geojson",

    "unidades_conservacao_2024_03.geojson",

    "unidades_conservacao_2024_04.geojson"

];



// ============================================================
// 3. NORMALIZAR TEXTO
// ============================================================

function normalizarTexto(valor) {

    if (
        valor === null ||
        valor === undefined
    ) {

        return "";

    }


    return String(valor)

        .trim()

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        );

}



// ============================================================
// 4. VERIFICAR SE É BRASIL
// ============================================================

function ehBrasil(feature) {

    const p =
        feature.properties || {};


    // ========================================================
    // PRIORIDADE 1: COUNTRY
    // ========================================================

    if (
        p.COUNTRY !== undefined &&
        p.COUNTRY !== null
    ) {

        const pais =
            normalizarTexto(
                p.COUNTRY
            );


        return (

            pais === "brazil" ||

            pais === "brasil"

        );

    }


    // ========================================================
    // OUTROS CAMPOS POSSÍVEIS
    // ========================================================

    const camposPais = [

        "Country",

        "country",

        "NAME_0",

        "Name_0",

        "name_0",

        "PAIS",

        "Pais",

        "pais",

        "COUNTRY_NAME",

        "Country_Name",

        "country_name"

    ];


    for (
        const campo of camposPais
    ) {

        if (
            p[campo] === undefined ||
            p[campo] === null
        ) {

            continue;

        }


        const pais =
            normalizarTexto(
                p[campo]
            );


        if (

            pais === "brazil" ||

            pais === "brasil"

        ) {

            return true;

        }

    }


    // ========================================================
    // NÃO ENCONTROU PAÍS
    // ========================================================

    return false;

}



// ============================================================
// 5. CARREGAR ARQUIVOS
// ============================================================

async function carregarArquivos(

    listaArquivos,

    somenteBrasil = false

) {

    let todasFeatures = [];


    for (

        const arquivo of listaArquivos

    ) {

        try {

            console.log(
                "Carregando:",
                arquivo
            );


            const resposta =
                await fetch(
                    arquivo
                );


            if (!resposta.ok) {

                throw new Error(

                    `Erro HTTP ${resposta.status}`

                );

            }


            const dados =
                await resposta.json();


            let features =
                dados.features || [];


            console.log(

                `${arquivo}: ${features.length} feições originais`

            );


            // ==================================================
            // FILTRO DOS ESTADOS
            // ==================================================

            if (somenteBrasil) {

                const totalAntes =
                    features.length;


                features =
                    features.filter(

                        feature => {

                            return ehBrasil(
                                feature
                            );

                        }

                    );


                console.log(

                    `${arquivo}: ${features.length} feições mantidas como Brasil de ${totalAntes}`

                );

            }


            todasFeatures.push(
                ...features
            );


        } catch (erro) {

            console.error(

                `Erro ao carregar ${arquivo}:`,

                erro

            );

        }

    }


    console.log(

        "Total de feições carregadas:",

        todasFeatures.length

    );


    return {

        type: "FeatureCollection",

        features: todasFeatures

    };

}



// ============================================================
// 6. RANKING
// ============================================================

function obterRanking(feature) {

    const p =
        feature.properties || {};


    const camposRanking = [

        "Rank_Category",

        "Burned Area Rank",

        "Burned_Area_Rank",

        "Ranking",

        "ranking",

        "Rank",

        "rank"

    ];


    for (

        const campo of camposRanking

    ) {

        if (

            p[campo] !== undefined &&

            p[campo] !== null &&

            p[campo] !== ""

        ) {

            const valor =
                Number(
                    p[campo]
                );


            if (
                Number.isFinite(valor)
            ) {

                return valor;

            }

        }

    }


    return null;

}



// ============================================================
// 7. NOME
// ============================================================

function obterNome(feature) {

    const p =
        feature.properties || {};


    const camposNome = [

        "region_nam",

        "reigon_nam",

        "Region Name",

        "NAME_1",

        "NM_ESTADO",

        "NM_UF",

        "NAME",

        "nome",

        "Nome",

        "name",

        "NAME_0",

        "Region"

    ];


    for (

        const campo of camposNome

    ) {

        if (

            p[campo] !== undefined &&

            p[campo] !== null &&

            String(p[campo]).trim() !== ""

        ) {

            return String(
                p[campo]
            );

        }

    }


    return "Sem nome";

}



// ============================================================
// 8. ÁREA QUEIMADA
// ============================================================

function obterArea(feature) {

    const p =
        feature.properties || {};


    const camposArea = [

        "Burned Area (km^2)",

        "Burned_Area_km2",

        "Burned Area",

        "burned_area",

        "area_queimada",

        "Area Queimada"

    ];


    for (

        const campo of camposArea

    ) {

        if (

            p[campo] !== undefined &&

            p[campo] !== null &&

            p[campo] !== ""

        ) {

            const valor =
                Number(
                    p[campo]
                );


            if (
                Number.isFinite(valor)
            ) {

                return valor;

            }

        }

    }


    return null;

}



// ============================================================
// 9. CORES
// ============================================================

function corRanking(rank) {

    if (
        rank === null ||
        rank === undefined
    ) {

        return "#cccccc";

    }


    rank =
        Number(rank);


    if (rank === 1)
        return "#7f0000";


    if (rank === 2)
        return "#b30000";


    if (rank === 3)
        return "#d7301f";


    if (rank === 4)
        return "#ef6548";


    if (rank === 5)
        return "#fdae61";


    if (
        rank >= 6 &&
        rank <= 18
    )

        return "#bdbdbd";


    if (rank === 19)
        return "#c6dbef";


    if (rank === 20)
        return "#9ecae1";


    if (rank === 21)
        return "#6baed6";


    if (rank === 22)
        return "#4292c6";


    if (rank === 23)
        return "#2171b5";


    if (rank === 24)
        return "#084594";


    return "#cccccc";

}



// ============================================================
// 10. ESTILO
// ============================================================

function estiloPorRanking(feature) {

    const rank =
        obterRanking(feature);


    return {

        fillColor:
            corRanking(rank),

        weight: 1,

        opacity: 1,

        color: "#555",

        fillOpacity: 0.75

    };

}



// ============================================================
// 11. ESCAPAR HTML
// ============================================================

function escaparHTML(valor) {

    if (
        valor === null ||
        valor === undefined
    ) {

        return "";

    }


    return String(valor)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ============================================================
// 12. FORMATAÇÃO
// ============================================================

function formatarValor(valor) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {

        return "Não disponível";

    }


    if (
        typeof valor === "number"
    ) {

        return valor.toLocaleString(

            "pt-BR",

            {

                maximumFractionDigits: 4

            }

        );

    }


    if (
        typeof valor === "boolean"
    ) {

        return valor
            ? "Sim"
            : "Não";

    }


    if (
        typeof valor === "object"
    ) {

        return JSON.stringify(
            valor
        );

    }


    return String(valor);

}



// ============================================================
// 13. POPUP
// ============================================================

function popupRanking(

    feature,

    layer

) {

    const nome =
        obterNome(feature);


    const rank =
        obterRanking(feature);


    const area =
        obterArea(feature);


    let html = `

        <strong>
            ${escaparHTML(nome)}
        </strong>

        <br><br>

    `;


    if (
        rank !== null
    ) {

        html += `

            <b>Ranking:</b>
            ${rank}

            <br>

        `;

    }


    if (
        area !== null
    ) {

        html += `

            <b>Área queimada:</b>
            ${formatarValor(area)}
            km²

        `;

    }


    layer.bindPopup(
        html
    );

}



// ============================================================
// 14. GRUPOS
// ============================================================

const grupoEstados =
    L.layerGroup();


const grupoBiomas =
    L.layerGroup();


const grupoTI =
    L.layerGroup();


const grupoUC =
    L.layerGroup();



// ============================================================
// 15. DADOS
// ============================================================

let dadosEstados = null;

let dadosBiomas = null;

let dadosTI = null;

let dadosUC = null;



// ============================================================
// 16. CRIAR CAMADA
// ============================================================

function criarCamada(data) {

    return L.geoJSON(

        data,

        {

            style:
                estiloPorRanking,

            onEachFeature:
                popupRanking

        }

    );

}



// ============================================================
// 17. CARREGAR ESTADOS
// ============================================================

carregarArquivos(

    arquivosEstados,

    true

).then(

    data => {

        dadosEstados =
            data;


        const camada =
            criarCamada(data);


        camada.addTo(
            grupoEstados
        );


        console.log(

            "ESTADOS DO BRASIL:",

            data.features.length

        );

    }

);



// ============================================================
// 18. CARREGAR BIOMAS
// ============================================================

carregarArquivos(

    arquivosBiomas

).then(

    data => {

        dadosBiomas =
            data;


        const camada =
            criarCamada(data);


        camada.addTo(
            grupoBiomas
        );


        console.log(

            "BIOMAS:",

            data.features.length

        );

    }

);



// ============================================================
// 19. CARREGAR TERRAS INDÍGENAS
// ============================================================

carregarArquivos(

    arquivosTI

).then(

    data => {

        dadosTI =
            data;


        const camada =
            criarCamada(data);


        camada.addTo(
            grupoTI
        );


        console.log(

            "TERRAS INDÍGENAS:",

            data.features.length

        );

    }

);



// ============================================================
// 20. CARREGAR UNIDADES DE CONSERVAÇÃO
// ============================================================

carregarArquivos(

    arquivosUC

).then(

    data => {

        dadosUC =
            data;


        const camada =
            criarCamada(data);


        camada.addTo(
            grupoUC
        );


        console.log(

            "UNIDADES DE CONSERVAÇÃO:",

            data.features.length

        );

    }

);



// ============================================================
// 21. CONTROLE DE CAMADAS
// ============================================================

const controleCamadas = {

    "Estados":
        grupoEstados,

    "Biomas":
        grupoBiomas,

    "Terras Indígenas":
        grupoTI,

    "Unidades de Conservação":
        grupoUC

};


L.control.layers(

    null,

    controleCamadas,

    {

        collapsed: false

    }

).addTo(mapa);



// ============================================================
// 22. LEGENDA
// ============================================================

const legenda =
    L.control({

        position:
            "bottomright"

    });


legenda.onAdd =
    function() {

        const div =
            L.DomUtil.create(

                "div",

                "legenda-ranking"

            );


        div.innerHTML = `

            <strong>
                Ranking de Área Queimada
            </strong>

            <br>

            <div>
                <i style="background:#7f0000"></i>
                1
            </div>

            <div>
                <i style="background:#b30000"></i>
                2
            </div>

            <div>
                <i style="background:#d7301f"></i>
                3
            </div>

            <div>
                <i style="background:#ef6548"></i>
                4
            </div>

            <div>
                <i style="background:#fdae61"></i>
                5
            </div>

            <div>
                <i style="background:#bdbdbd"></i>
                6–18
            </div>

            <div>
                <i style="background:#c6dbef"></i>
                19
            </div>

            <div>
                <i style="background:#9ecae1"></i>
                20
            </div>

            <div>
                <i style="background:#6baed6"></i>
                21
            </div>

            <div>
                <i style="background:#4292c6"></i>
                22
            </div>

            <div>
                <i style="background:#2171b5"></i>
                23
            </div>

            <div>
                <i style="background:#084594"></i>
                24
            </div>

        `;


        return div;

    };


legenda.addTo(mapa);



// ============================================================
// 23. OBTER DADOS DA CAMADA
// ============================================================

function obterDadosDaCamada(

    nomeCamada

) {

    if (
        nomeCamada ===
        "Estados"
    )

        return dadosEstados;


    if (
        nomeCamada ===
        "Biomas"
    )

        return dadosBiomas;


    if (
        nomeCamada ===
        "Terras Indígenas"
    )

        return dadosTI;


    if (
        nomeCamada ===
        "Unidades de Conservação"
    )

        return dadosUC;


    return null;

}



// ============================================================
// 24. OBTER GRUPO DA CAMADA
// ============================================================

function obterGrupoDaCamada(

    nomeCamada

) {

    if (
        nomeCamada ===
        "Estados"
    )

        return grupoEstados;


    if (
        nomeCamada ===
        "Biomas"
    )

        return grupoBiomas;


    if (
        nomeCamada ===
        "Terras Indígenas"
    )

        return grupoTI;


    if (
        nomeCamada ===
        "Unidades de Conservação"
    )

        return grupoUC;


    return null;

}



// ============================================================
// 25. IDENTIFICADOR
// ============================================================

function obterIdentificador(

    feature

) {

    const p =
        feature.properties || {};


    const campos = [

        "terrai_cod",

        "Cnuc",

        "region_id",

        "NAME_1",

        "NM_ESTADO",

        "ID",

        "id"

    ];


    for (
        const campo of campos
    ) {

        if (

            p[campo] !== undefined &&

            p[campo] !== null &&

            p[campo] !== ""

        ) {

            return String(
                p[campo]
            );

        }

    }


    return "";

}



// ============================================================
// 26. SELEÇÃO DA CAMADA NO RELATÓRIO
// ============================================================

document

    .getElementById(
        "seletor-camada"
    )

    .addEventListener(

        "change",

        function() {

            const nomeCamada =
                this.value;


            const seletorEntidade =
                document.getElementById(
                    "seletor-entidade"
                );


            const container =
                document.getElementById(
                    "container-entidade"
                );


            const conteudo =
                document.getElementById(
                    "conteudo-relatorio"
                );


            // --------------------------------------------------
            // LIMPAR
            // --------------------------------------------------

            seletorEntidade.innerHTML = `

                <option value="">

                    Selecione...

                </option>

            `;


            container.style.display =
                "none";


            conteudo.className =
                "mensagem-relatorio";


            conteudo.innerHTML = `

                Selecione uma camada
                para gerar o relatório.

            `;


            if (!nomeCamada) {

                return;

            }


            const dados =
                obterDadosDaCamada(
                    nomeCamada
                );


            // --------------------------------------------------
            // DADOS AINDA CARREGANDO
            // --------------------------------------------------

            if (!dados) {

                conteudo.innerHTML = `

                    Carregando os dados de
                    <strong>
                        ${escaparHTML(nomeCamada)}
                    </strong>...

                `;


                setTimeout(

                    () => {

                        document

                            .getElementById(
                                "seletor-camada"
                            )

                            .dispatchEvent(

                                new Event(
                                    "change"
                                )

                            );

                    },

                    800

                );


                return;

            }


            if (

                !dados.features ||

                dados.features.length === 0

            ) {

                conteudo.innerHTML = `

                    Não existem dados disponíveis
                    para esta camada.

                `;

                return;

            }


            // --------------------------------------------------
            // MOSTRAR CAMADA NO MAPA
            // --------------------------------------------------

            const grupo =
                obterGrupoDaCamada(
                    nomeCamada
                );


            if (

                grupo &&

                !mapa.hasLayer(grupo)

            ) {

                grupo.addTo(mapa);

            }


            // --------------------------------------------------
            // PREENCHER ENTIDADES
            // --------------------------------------------------

            dados.features.forEach(

                (

                    feature,

                    index

                ) => {

                    const nome =
                        obterNome(
                            feature
                        );


                    const identificador =
                        obterIdentificador(
                            feature
                        );


                    let texto =
                        nome;


                    if (
                        identificador
                    ) {

                        texto +=
                            ` — ${identificador}`;

                    }


                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        index;


                    option.textContent =
                        texto;


                    seletorEntidade
                        .appendChild(
                            option
                        );

                }

            );


            container.style.display =
                "flex";


            conteudo.innerHTML = `

                Agora selecione
                o item que deseja consultar.

            `;

        }

    );



// ============================================================
// 27. SELEÇÃO DA ENTIDADE
// ============================================================

document

    .getElementById(
        "seletor-entidade"
    )

    .addEventListener(

        "change",

        function() {

            const nomeCamada =

                document

                    .getElementById(
                        "seletor-camada"
                    )

                    .value;


            const indice =
                Number(
                    this.value
                );


            const conteudo =
                document.getElementById(
                    "conteudo-relatorio"
                );


            if (

                !nomeCamada ||

                this.value === ""

            ) {

                conteudo.innerHTML = `

                    Selecione um item
                    para visualizar o relatório.

                `;

                return;

            }


            const dados =
                obterDadosDaCamada(
                    nomeCamada
                );


            if (

                !dados ||

                !dados.features[indice]

            ) {

                conteudo.innerHTML = `

                    Não foi possível localizar
                    o item selecionado.

                `;

                return;

            }


            const feature =
                dados.features[indice];


            gerarRelatorio(

                feature,

                nomeCamada

            );


            // --------------------------------------------------
            // CENTRALIZAR
            // --------------------------------------------------

            try {

                const geo =
                    L.geoJSON(
                        feature
                    );


                const bounds =
                    geo.getBounds();


                if (

                    bounds &&

                    bounds.isValid()

                ) {

                    mapa.fitBounds(

                        bounds,

                        {

                            padding:
                                [30, 30],

                            maxZoom:
                                8

                        }

                    );

                }

            }

            catch (erro) {

                console.warn(

                    "Não foi possível centralizar:",

                    erro

                );

            }

        }

    );



// ============================================================
// 28. GERAR RELATÓRIO
// ============================================================

function gerarRelatorio(

    feature,

    nomeCamada

) {

    const conteudo =
        document.getElementById(
            "conteudo-relatorio"
        );


    const p =
        feature.properties || {};


    const nome =
        obterNome(feature);


    const rank =
        obterRanking(feature);


    const area =
        obterArea(feature);


    // ========================================================
    // CABEÇALHO
    // ========================================================

    let html = `

        <div class="cabecalho-relatorio">

            <h4>
                ${escaparHTML(nome)}
            </h4>

            <p>

                <strong>Camada:</strong>

                ${escaparHTML(nomeCamada)}

            </p>

        </div>

    `;


    // ========================================================
    // CARTÕES
    // ========================================================

    html += `

        <div class="resumo-relatorio">

    `;


    // --------------------------------------------------------
    // NOME
    // --------------------------------------------------------

    html += `

        <div class="cartao-resumo">

            <div class="titulo">

                Área selecionada

            </div>

            <div class="valor">

                ${escaparHTML(nome)}

            </div>

        </div>

    `;


    // --------------------------------------------------------
    // RANKING
    // --------------------------------------------------------

    if (
        rank !== null
    ) {

        let classeRanking =
            "ranking-6-18";


        if (

            rank >= 1 &&

            rank <= 5

        ) {

            classeRanking =
                `ranking-${rank}`;

        }


        else if (
            rank >= 19
        ) {

            classeRanking =
                `ranking-${rank}`;

        }


        html += `

            <div class="cartao-resumo">

                <div class="titulo">

                    Ranking

                </div>

                <div class="valor">

                    <span
                        class="
                            ranking
                            ${classeRanking}
                        "
                    >

                        ${rank}

                    </span>

                </div>

            </div>

        `;

    }


    // --------------------------------------------------------
    // ÁREA
    // --------------------------------------------------------

    if (
        area !== null
    ) {

        html += `

            <div class="cartao-resumo">

                <div class="titulo">

                    Área queimada

                </div>

                <div class="valor">

                    ${formatarValor(area)}
                    km²

                </div>

            </div>

        `;

    }


    html += `

        </div>

    `;



    // ========================================================
    // INFORMAÇÕES
    // ========================================================

    html += `

        <h4
            style="
                margin-top:30px;
                margin-bottom:10px;
            "
        >

            Informações

        </h4>


        <table
            class="tabela-relatorio"
        >

            <tbody>

    `;


    // ========================================================
    // CAMPOS A IGNORAR
    // ========================================================

    const camposIgnorar = [

        "geometry",

        "shape",

        "Shape_Area",

        "Shape_Length",

        "OBJECTID",

        "FID",

        "id",

        "region_id"

    ];


    // ========================================================
    // CAMPOS PRINCIPAIS
    // ========================================================

    const camposPreferenciais = [

        "region_nam",

        "reigon_nam",

        "Region Name",

        "NAME_1",

        "NM_ESTADO",

        "NM_UF",

        "NAME",

        "nome",

        "Nome",

        "name",

        "Rank_Category",

        "Burned Area Rank",

        "Burned_Area_Rank",

        "Ranking",

        "ranking",

        "Rank",

        "rank",

        "Burned Area (km^2)",

        "Burned_Area_km2",

        "Burned Area",

        "burned_area",

        "area_queimada",

        "Area Queimada",

        "region_des",

        "Region",

        "terrai_cod",

        "Cnuc"

    ];


    const camposAdicionados =
        new Set();


    // ========================================================
    // CAMPOS PREFERENCIAIS
    // ========================================================

    camposPreferenciais.forEach(

        campo => {

            if (

                !Object.prototype
                    .hasOwnProperty
                    .call(
                        p,
                        campo
                    )

            ) {

                return;

            }


            if (
                camposIgnorar
                    .includes(campo)
            ) {

                return;

            }


            if (
                camposAdicionados
                    .has(campo)
            ) {

                return;

            }


            camposAdicionados
                .add(campo);


            let valor =
                formatarValor(
                    p[campo]
                );


            // ------------------------------------------------
            // RANKING
            // ------------------------------------------------

            if (

                [

                    "Rank_Category",

                    "Burned Area Rank",

                    "Burned_Area_Rank",

                    "Ranking",

                    "ranking",

                    "Rank",

                    "rank"

                ].includes(campo)

            ) {

                const r =
                    Number(
                        p[campo]
                    );


                if (
                    Number.isFinite(r)
                ) {

                    let classe =
                        "ranking-6-18";


                    if (

                        r >= 1 &&

                        r <= 5

                    ) {

                        classe =
                            `ranking-${r}`;

                    }


                    else if (
                        r >= 19
                    ) {

                        classe =
                            `ranking-${r}`;

                    }


                    valor = `

                        <span
                            class="
                                ranking
                                ${classe}
                            "
                        >

                            ${r}

                        </span>

                    `;

                }

            }


            html += `

                <tr>

                    <th>

                        ${escaparHTML(campo)}

                    </th>

                    <td>

                        ${valor}

                    </td>

                </tr>

            `;

        }

    );



    // ========================================================
    // CAMPOS ADICIONAIS
    // ========================================================

    Object.keys(p).forEach(

        campo => {

            if (
                camposAdicionados
                    .has(campo)
            ) {

                return;

            }


            if (
                camposIgnorar
                    .includes(campo)
            ) {

                return;

            }


            const valor =
                formatarValor(
                    p[campo]
                );


            // Não mostrar estruturas gigantes

            if (
                valor.length > 500
            ) {

                return;

            }


            camposAdicionados
                .add(campo);


            html += `

                <tr>

                    <th>

                        ${escaparHTML(campo)}

                    </th>

                    <td>

                        ${escaparHTML(valor)}

                    </td>

                </tr>

            `;

        }

    );


    html += `

            </tbody>

        </table>

    `;



    // ========================================================
    // GRÁFICO
    // ========================================================

    if (
        area !== null
    ) {

        html += `

            <div id="area-grafico">

                <h4>

                    Área Queimada

                </h4>

                <canvas
                    id="grafico-area"
                ></canvas>

            </div>

        `;

    }


    conteudo.className = "";


    conteudo.innerHTML =
        html;


    // ========================================================
    // CRIAR GRÁFICO
    // ========================================================

    if (
        area !== null
    ) {

        criarGraficoArea(

            nome,

            area,

            rank

        );

    }

}



// ============================================================
// 29. GRÁFICO
// ============================================================

function criarGraficoArea(

    nome,

    area,

    rank

) {

    const canvas =
        document.getElementById(
            "grafico-area"
        );


    if (!canvas) {

        return;

    }


    const ctx =
        canvas.getContext(
            "2d"
        );


    const largura =
        canvas.clientWidth ||
        800;


    const altura =
        canvas.clientHeight ||
        300;


    canvas.width =
        largura;


    canvas.height =
        altura;


    const margemEsquerda = 80;

    const margemDireita = 30;

    const margemSuperior = 40;

    const margemInferior = 60;


    const larguraGrafico =

        largura -

        margemEsquerda -

        margemDireita;


    const alturaGrafico =

        altura -

        margemSuperior -

        margemInferior;


    ctx.clearRect(

        0,

        0,

        largura,

        altura

    );


    const maximo =
        area > 0
            ? area
            : 1;


    // ========================================================
    // EIXOS
    // ========================================================

    ctx.beginPath();


    ctx.moveTo(

        margemEsquerda,

        margemSuperior

    );


    ctx.lineTo(

        margemEsquerda,

        margemSuperior +
        alturaGrafico

    );


    ctx.lineTo(

        margemEsquerda +
        larguraGrafico,

        margemSuperior +
        alturaGrafico

    );


    ctx.strokeStyle =
        "#777";


    ctx.lineWidth = 1;


    ctx.stroke();


    // ========================================================
    // BARRA
    // ========================================================

    const larguraBarra =
        Math.min(

            180,

            larguraGrafico * 0.4

        );


    const alturaBarra =

        (

            area /

            maximo

        ) *

        alturaGrafico;


    const x =

        margemEsquerda +

        (

            larguraGrafico -

            larguraBarra

        ) / 2;


    const y =

        margemSuperior +

        alturaGrafico -

        alturaBarra;


    let corBarra =
        "#777";


    if (
        rank !== null
    ) {

        corBarra =
            corRanking(rank);

    }


    ctx.fillStyle =
        corBarra;


    ctx.fillRect(

        x,

        y,

        larguraBarra,

        alturaBarra

    );


    // ========================================================
    // VALOR
    // ========================================================

    ctx.fillStyle =
        "#222";


    ctx.font =
        "bold 15px Arial";


    ctx.textAlign =
        "center";


    ctx.fillText(

        `${formatarValor(area)} km²`,

        x +
        larguraBarra / 2,

        Math.max(
            y - 10,
            20
        )

    );


    // ========================================================
    // NOME
    // ========================================================

    ctx.font =
        "14px Arial";


    ctx.fillText(

        nome.length > 25

            ? nome.substring(
                0,
                25
            ) + "..."

            : nome,

        x +
        larguraBarra / 2,

        margemSuperior +
        alturaGrafico +
        30

    );

}
