// ============================================================
// 5. FORMATAR NÚMERO
// ============================================================

function formatarNumero(
    valor
) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {

        return "-";

    }


    const numero =
        Number(valor);


    if (
        !Number.isFinite(numero)
    ) {

        return String(valor);

    }


    return numero.toLocaleString(
        "pt-BR",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

}


// ============================================================
// 6. ESCAPAR HTML
// ============================================================

function escaparHTML(
    valor
) {

    return String(valor)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


// ============================================================
// 7. NORMALIZAR TEXTO
// ============================================================

function normalizarTexto(
    texto
) {

    return String(
        texto ?? ""
    )
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .toUpperCase()
        .trim()
        .replace(
            /\s+/g,
            " "
        );

}

// ============================================================

function obterSiglaEstado(
    feature
) {

    const props =
        feature?.properties || {};


    const candidatosUF = [

        props.SIGLA_UF,

        props.sigla_uf,

        props.SIGLA,

        props.sigla,

        props.UF,

        props.uf,

        props.CD_UF,

        props.cd_uf

    ];


    for (
        const valor of candidatosUF
    ) {

        if (
            valor !== undefined &&
            valor !== null &&
            String(valor).trim() !== ""
        ) {

            const normalizado =
                normalizarTexto(valor);


            if (
                NOME_ESTADO_PARA_SIGLA[
                    normalizado
                ]
            ) {

                return NOME_ESTADO_PARA_SIGLA[
                    normalizado
                ];

            }


            if (
                ESTADOS_BRASIL[
                    normalizado
                ]
            ) {

                return normalizado;

            }

        }

    }


    const candidatosNome = [

        props.NOME_UF,

        props.nome_uf,

        props.NM_UF,

        props.nm_uf,

        props.NOME_ESTADO,

        props.nome_estado,

        props.ESTADO,

        props.estado

    ];


    for (
        const valor of candidatosNome
    ) {

        if (
            valor !== undefined &&
            valor !== null &&
            String(valor).trim() !== ""
        ) {

            const sigla =
                NOME_ESTADO_PARA_SIGLA[
                    normalizarTexto(valor)
                ];


            if (
                sigla

                return sigla;

            }

        }

    }


    return null;

}

// ============================================================
// 15. NORMALIZAR GEOJSON
// ============================================================

function normalizarGeoJSON(
    bruto
) {

    if (
        !bruto
    ) {

        return {
            type:
                "FeatureCollection",

            features:
                []
        };

    }


    if (
        bruto.type ===
        "FeatureCollection"
    ) {

        return bruto;

    }


    if (
        bruto.type ===
        "Feature"
    ) {

        return {

            type:
                "FeatureCollection",

            features:
                [
                    bruto
                ]

        };

    }


    if (
        Array.isArray(
            bruto.features
        )
    ) {

        return {

            type:
                "FeatureCollection",

            features:
                bruto.features

        };

    }


    return {

        type:
            "FeatureCollection",

        features:
            []

    };

}

            {

                style:
                    feature =>
                        estiloFeature(

                            tipo
                        ),


                onEachFeature:
                    function(
                        feature,
                        layer
                    ) {

                        layer.on({

                            mouseover:
                                function(e) {

                                    e.target.setStyle({

                                        weight:
                                            tipo === "biomas"
                                                ? 2.5

                                        color:
                                            "#111827",

                                        fillOpacity:
                                            0.88

                                    });

                                },


                            mouseout:

                                        e.target

// 16F. MUNICÍPIOS — CRIAR CAMADA
// ============================================================

function criarCamadaMunicipios(
    dados
) {

    if (
        !dados ||
        !dados.features ||
        !dados.features.length
    ) {

        return null;

    }


    const camada =
        L.geoJSON(
            dados,
            {

                style:
                    estiloMunicipio,


                onEachFeature:
                    function(
                        feature,
                        layer
                    ) {

                        layer.on({

                            mouseover:
                                function(e) {

                                    e.target.setStyle({

                                        weight:
                                            1.8,

                                        color:
                                            "#111827",

                                        fillOpacity:
                                            0.88

                                    });

                                },


                            mouseout:
                                function(e) {

                                    camada.resetStyle(
                                        e.target
                                    );

                                },


                            click:
                                function(e) {

                                    mostrarPopupMunicipio(
                                        e.target.feature,
                                        e.target
                                    );


                                    atualizarPainelMunicipio(
                                        e.target.feature
                                    );

                                }

                        });

                    }

            }

        );


    grupoMunicipios.addLayer(
        camada
    );


    return camada;

}


// ============================================================
// 16G. MUNICÍPIOS — BUSCAR GEOJSON
// ============================================================

async function carregarGeoJSONMunicipio(
    url
) {

    const resposta =
        await fetch(
            url,
            {
                cache:
                    "force-cache"
            }
        );


    if (
        !resposta.ok
    ) {

        throw new Error(
            `${url}: HTTP ${resposta.status}`
        );

    }


    const bruto =
        await resposta.json();


    const dados =
        normalizarGeoJSON(
            bruto
        );


    if (
        !dados ||
        !dados.features ||
        !dados.features.length
    ) {

        throw new Error(
            `${url}: nenhuma feição encontrada`
        );

    }


    return dados;

}


// ============================================================
// 16H. MUNICÍPIOS — URL
// ============================================================

function obterUrlMunicipio(
    pasta,
    uf,
    numero
) {

    return `${pasta}/${uf}_${String(numero).padStart(2, "0")}.geojson`;

}


// ============================================================
// 16I. MUNICÍPIOS — DESCOBRIR PASTA
// ============================================================

async function descobrirPastaMunicipios(
    uf
) {

    for (
        const pasta
        of PASTAS_MUNICIPIOS
    ) {

        const url =
            obterUrlMunicipio(
                pasta,
                uf,
                1
            );


        try {

            const primeiro =
                await carregarGeoJSONMunicipio(
                    url
                );


            return {

                pasta:
                    pasta,

                primeiro:
                    primeiro

            };

        }

        catch (
            erro
        ) {

            console.warn(
                `Arquivo municipal não encontrado: ${url}`
            );

        }

    }


    return null;

}

// ============================================================
// 16K. MUNICÍPIOS — CARREGAR ESTADO
// ============================================================

async function carregarMunicipiosDoEstado(
    featureEstado
) {

    const uf =
        obterSiglaEstado(
            featureEstado
        );


    if (
        !uf
    ) {

        console.warn(
            "Não foi possível identificar a UF do estado clicado."
        );

        return;

    }


    const tokenAtual =
        ++tokenCarregamentoMunicipios;


    estadoMunicipiosAtual =
        uf;


    // --------------------------------------------------------
    // Remove os municípios do estado anterior
    // --------------------------------------------------------

    grupoMunicipios.clearLayers();


    // --------------------------------------------------------
    // Mostra a camada municipal
    // --------------------------------------------------------

    if (
        !map.hasLayer(
            grupoMunicipios
        )
    ) {

        grupoMunicipios.addTo(
            map
        );

    }


    // --------------------------------------------------------
    // CACHE
    // --------------------------------------------------------

    if (
        cacheMunicipios.has(
            uf
        )
    ) {

        const arquivosCache =
            cacheMunicipios.get(
                uf
            );


        for (
            const dados
            of arquivosCache
        ) {

            if (
                tokenAtual !==
                tokenCarregamentoMunicipios
            ) {

                return;

            }


            criarCamadaMunicipios(
                dados
            );

        }


        grupoMunicipios.bringToFront();

        return;

    }


    const titulo =
        document.getElementById(
            "painel-titulo"
        );


    const descricao =
        document.getElementById(
            "painel-descricao"
        );


    if (
        titulo
    ) {

        titulo.innerText =
            `Carregando municípios — ${uf}`;

    }


    if (
        descricao
    ) {

        descricao.innerText =
            "Carregando os dados municipais deste estado...";

    }


    // --------------------------------------------------------
    // Descobrir onde está o primeiro arquivo
    // --------------------------------------------------------

    const descoberta =
        await descobrirPastaMunicipios(
            uf
        );


    if (
        tokenAtual !==
        tokenCarregamentoMunicipios
    ) {

        return;

    }


    if (
        !descoberta
    ) {

        if (
            titulo
        ) {

            titulo.innerText =
                ESTADOS_BRASIL[
                    uf
                ] ||
                uf;

        }


        if (
            descricao
        ) {

            descricao.innerText =
                `Nenhum arquivo municipal encontrado em ${PASTAS_MUNICIPIOS.join(" ou ")}.`;

        }


        console.error(
            `Nenhum arquivo municipal encontrado para ${uf}.`
        );


        return;

    }


    // --------------------------------------------------------
    // Primeiro arquivo
    // --------------------------------------------------------

    const arquivos = [

        descoberta.primeiro

    ];


    criarCamadaMunicipios(
        descoberta.primeiro
    );


    // --------------------------------------------------------
    // Carregar UF_02, UF_03, UF_04...
    // --------------------------------------------------------

    for (
        let numero = 2;

        numero <=
        MAX_ARQUIVOS_MUNICIPIOS;

        numero++
    ) {

        if (
            tokenAtual !==
            tokenCarregamentoMunicipios
        ) {

            return;

        }


        const url =
            obterUrlMunicipio(
                descoberta.pasta,
                uf,
                numero
            );


        try {

            const dados =
                await carregarGeoJSONMunicipio(
                    url
                );


            if (
                tokenAtual !==
                tokenCarregamentoMunicipios
            ) {

                return;

            }


            arquivos.push(
                dados
            );


            criarCamadaMunicipios(
                dados
            );

        }

        catch (
            erro
        ) {

            // Quando encontrar o primeiro arquivo
            // inexistente, encerra a sequência.

            break;

        }

    }


    if (
        tokenAtual !==
        tokenCarregamentoMunicipios
    ) {

        return;

    }


    // --------------------------------------------------------
    // Salvar no cache
    // --------------------------------------------------------

    cacheMunicipios.set(
        uf,
        arquivos
    );


    grupoMunicipios.bringToFront();


    // --------------------------------------------------------
    // Atualizar painel
    // --------------------------------------------------------

    if (
        titulo
    ) {

        titulo.innerText =
            ESTADOS_BRASIL[
                uf
            ] ||
            uf;

    }


    if (
        descricao
    ) {

        const totalFeatures =
            arquivos.reduce(

                (
                    soma,
                    dados
                ) =>

                    soma +
                    (
                        dados.features?.length ||
                        0
                    ),

                0

            );


        descricao.innerText =

            `${totalFeatures.toLocaleString("pt-BR")} municípios carregados. Clique em um município para consultar os dados.`;

    }

}

function obterValorCampoVetor(
    feature,
    chave
) {

    const props =
        feature?.properties || {};


    if (
        props[chave] !== undefined &&
        props[chave] !== null &&
        props[chave] !== ""
    ) {

        return props[chave];

    }


    const variantes = {

        "Burned Area (km^2)": [

            "Burned Area (km²)",

            "Burned Area (km2)",

            "Burned_Area_km2"

        ],

        "Burned Area Fraction (%)": [

            "Burned Area Fraction",

            "Burned_Area_Fraction"

        ],

        "Burned Area Rank": [

            "Burned_Area_Rank",

            "Rank_Category"

        ],

        "Burned Area Fraction Rank": [

            "Burned_Area_Fraction_Rank"

        ],

        "Burned Area Percentile": [

            "Burned_Area_Percentile"

        ],

        "Burned Area Fraction Percentile": [

            "Burned_Area_Fraction_Percentile"

        ]

    };


    const lista =
        variantes[chave] ||
        [];


    for (
        const variante
        of lista
    ) {

        if (
            props[variante] !== undefined &&
            props[variante] !== null &&
            props[variante] !== ""
        ) {

            return props[variante];

        }

    }


    return null;

}

// ============================================================

async function carregarArquivo(
    arquivo,
    grupo,
    tipo
) {

    const resposta =
        await fetch(
            arquivo,
            {
                cache:
                    "force-cache"
            }
        );


    if (
        !resposta.ok
    ) {

        throw new Error(
            `${arquivo}: HTTP ${resposta.status}`
        );

    }


    const bruto =
        await resposta.json();


    const dados =
        normalizarGeoJSON(
            bruto
        );


    if (
        !dados.features ||
        dados.features.length === 0
    ) {

        throw new Error(
            `${arquivo}: nenhuma feição encontrada`
        );

    }


    criarCamada(
        dados,
        grupo,
        tipo
    );


    return {

        quantidade:
            dados.features.length,

        features:
            dados.features,

        tipo:
            tipo

    };

}

// 25. CARREGAR TODOS OS DADOS
// ============================================================

async function carregarTodosDados() {

    const arquivos = [

        ...arquivosEstados.map(
            arquivo => ({

                arquivo,

                grupo:
                    grupoEstados,

                tipo:
                    "estados"

            })
        ),

        ...arquivosBiomas.map(
            arquivo => ({

                arquivo,

                grupo:
                    grupoBiomas,

                tipo:
                    "biomas"

            })
        )

    ];


    let concluidos =
        0;


    const total =
        arquivos.length;


    const promessas =
        arquivos.map(
            async item => {

                try {

                    const resultado =
                        await carregarArquivo(
                            item.arquivo,
                            item.grupo,
                            item.tipo
                        );


                    concluidos++;


                    atualizarLoading(

                        5 +
                        (
                            concluidos /
                            total
                        ) *
                        85,

                        `Carregando ${item.arquivo}...`

                    );


                    return resultado;

                }

                catch (
                    erro
                ) {

                    console.error(
                        erro
                    );


                    concluidos++;


                    atualizarLoading(

                        5 +
                        (
                            concluidos /
                            total
                        ) *
                        85,

                        `Erro ao carregar ${item.arquivo}`

                    );


                    return {

                        quantidade:
                            0,

                        features:
                            [],

                        tipo:
                            item.tipo

                    };

                }

            }

        );


    return await Promise.all(
        promessas
    );

}

const controleCamadas =

// ============================================================
// 27. AJUSTAR MAPA
// ============================================================

function ajustarMapa() {

    const camadas =
        [];


    if (
        grupoEstados.getLayers().length
    ) {

        camadas.push(
            ...grupoEstados.getLayers()
        );

    }


    if (
        grupoBiomas.getLayers().length
    ) {

        camadas.push(
            ...grupoBiomas.getLayers()
        );

    }


    if (
        camadas.length === 0
    ) {

        return;

    }


    const grupo =
        L.featureGroup(
            camadas
        );


    const bounds =
        grupo.getBounds();


    if (
        bounds.isValid()
    ) {

        map.fitBounds(
            bounds,
            {
                padding:
                    [30, 30]
            }
        );

    }

}

// ============================================================
// 29. RANKING
// ============================================================

let rankingEstados =
    [];


let rankingBiomas =
    [];


function obterNomeRanking(
    feature,
    tipo
) {

    if (
        tipo ===
        "estados"
    ) {

        return (
            obterNomeEstadoPadronizado(
                feature
            ) ||
            "Estado"
        );

    }


    return (
        obterNome(
            feature
        ) ||
        "Bioma"
    );

}


// ============================================================
// 30. DADOS RANKING
// ============================================================

function coletarFeatures(
    resultados,
    tipo
) {

    const features =
        [];


    resultados.forEach(
        resultado => {

            if (
                resultado.tipo !==
                tipo
            ) {

                return;

            }


            if (
                !resultado.features
            ) {

                return;

            }


            resultado.features.forEach(
                feature => {

                    features.push(
                        feature
                    );

                }
            );

        }
    );


    return features;

}


// ============================================================
// 31. CONSTRUIR RANKINGS
// ============================================================

function construirRankings(
    resultados
) {

    const featuresEstados =
        coletarFeatures(
            resultados,
            "estados"
        );


    const featuresBiomas =
        coletarFeatures(
            resultados,
            "biomas"
        );


    function construir(
        features,
        tipo
    ) {

        const mapa =
            new Map();


        features.forEach(
            feature => {

                const nome =
                    obterNomeRanking(
                        feature,
                        tipo
                    );


                const area =
                    obterArea(
                        feature
                    );


                if (
                    !nome ||
                    area === null
                ) {

                    return;

                }


                const chave =
                    normalizarTexto(
                        nome
                    );


                if (
                    !mapa.has(
                        chave
                    )
                ) {

                    mapa.set(
                        chave,
                        {

                            nome:
                                nome,

                            area:
                                Number(area),

                            feature:
                                feature

                        }

                    );

                }

                else {

                    mapa.get(
                        chave
                    ).area +=
                        Number(area);

                }

            }
        );


        const lista =
            Array.from(
                mapa.values()
            );


        lista.sort(
            (
                a,
                b
            ) =>
                b.area -
                a.area
        );


        lista.forEach(
            (
                item,
                indice
            ) => {

                item.ranking =
                    indice + 1;

            }
        );


        return lista;

    }


    rankingEstados =
        construir(
            featuresEstados,
            "estados"
        );


    rankingBiomas =
        construir(
            featuresBiomas,
            "biomas"
        );

}


// ============================================================
// 32. ABRIR RANKING
// ============================================================

function abrirRanking() {

    const modal =
        document.getElementById(
            "modal-ranking"
        );


    if (
        modal

        modal.classList.add(

// ============================================================
// 34. MOSTRAR RANKING
// ============================================================

function mostrarRanking(
    tipo
) {

    const lista =
        tipo ===
        "estados"

            ? rankingEstados

            : rankingBiomas;


    document
        .querySelectorAll(
            ".ranking-tab"
        )
        .forEach(
            tab => {

                tab.classList.remove(
                    "ativo"
                );

            }
        );


    const tab =
        document.getElementById(
            tipo ===
                "estados"

                ? "tab-estados"

                : "tab-biomas"
        );


    if (
        tab
    ) {

        tab.classList.add(
            "ativo"
        );

    }


    const container =
        document.getElementById(
            "ranking-lista"
        );


    const vazio =
        document.getElementById(
            "ranking-vazio"
        );


    const maior =
        document.getElementById(
            "resumo-maior"
        );


    const area =
        document.getElementById(
            "resumo-area"
        );


    const total =
        document.getElementById(
            "resumo-total"
        );


    if (
        !container
    ) {

        return;

    }


    container.innerHTML =
        "";


    if (
        !lista.length
    ) {

        if (
            vazio
        ) {

            vazio.style.display =
                "block";

        }


        return;

    }


    if (
        vazio
    ) {

        vazio.style.display =
            "none";

    }


    const areaTotal =
        lista.reduce(
            (
                soma,
                item
            ) =>
                soma +
                item.area,

            0
        );


    if (
        maior
    ) {

        maior.innerText =
            lista[0].nome;

    }


    if (
        area
    ) {

        area.innerText =
            `${formatarNumero(
                areaTotal
            )} km²`;

    }


    if (
        total
    ) {

        total.innerText =
            lista.length;

    }


    lista.forEach(
        item => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "ranking-item";


            const posicao =
                document.createElement(
                    "div"
                );


            posicao.className =
                "ranking-posicao";


            posicao.innerText =
                item.ranking;


            const nome =
                document.createElement(
                    "div"
                );


            nome.className =
                "ranking-nome";


            nome.innerText =
                item.nome;


            const valor =
                document.createElement(
                    "div"
                );


            valor.className =
                "ranking-valor";


            valor.innerText =

                `${formatarNumero(
                    item.area
                )} km²`;


            const barraContainer =
                document.createElement(
                    "div"
                );


            barraContainer.className =
                "ranking-barra-container";


            const barra =
                document.createElement(
                    "div"
                );


            barra.className =
                "ranking-barra";


            const maxArea =
                lista[0].area;


            const largura =
                maxArea > 0

                    ? (
                        item.area /
                        maxArea
                    ) * 100

                    : 0;


            barra.style.width =
                `${largura}%`;


            barraContainer.appendChild(
                barra
            );


            div.appendChild(
                posicao
            );


            div.appendChild(
                nome
            );


            div.appendChild(
                valor
            );


            div.appendChild(
                barraContainer
            );


            container.appendChild(
                div
            );

        }

    );

}

// 39. INICIALIZAÇÃO
// ============================================================

async function inicializar() {

    atualizarLoading(
        3,
        "Inicializando mapa..."
    );


    try {

        const resultados =
            await carregarTodosDados();


        atualizarLoading(
            96,
            "Organizando classificação da área queimada..."
        );


        construirRankings(
            resultados
        );


        if (
            grupoEstados.getLayers().length > 0
        ) {

            grupoEstados.addTo(
                map
            );

        }


        ajustarMapa();


        atualizarLoading(
            100,
            "Concluído."
        );


        setTimeout(
            fecharLoading,
            450
        );

    }

    catch (
        erro
    ) {

        console.error(
            erro
        );


        atualizarLoading(
            100,
            "Erro ao carregar os dados."
        );


        setTimeout(
            fecharLoading,
            1200
        );

    }

}


// ============================================================
// 40. INICIAR
// ============================================================

inicializar();
