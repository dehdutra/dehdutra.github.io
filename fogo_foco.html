<!-- fogo_foco.html -->

<h2>Teste do mapa</h2>

<p>
  Teste de carregamento dos polígonos dos estados.
</p>

<div style="
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
">

  <h3>Estados 2024</h3>

  <div
    id="mapa"
    style="
      width:100%;
      height:600px;
      border-radius:8px;
    "
  ></div>

</div>


<!-- ============================================================
     LEAFLET
     ============================================================ -->

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

document.addEventListener(
  "DOMContentLoaded",
  function () {

    console.log("INICIANDO MAPA");


    /* ========================================================
       1. CRIAR MAPA
       ======================================================== */

    const mapa =
      L.map("mapa").setView(
        [-14.2, -51.9],
        4
      );


    /* ========================================================
       2. MAPA BASE
       ======================================================== */

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution:
          "&copy; OpenStreetMap contributors"
      }
    ).addTo(mapa);


    /* ========================================================
       3. ARQUIVO
       ======================================================== */

    const arquivo =
      "dashboard_data/estados_2024_01.geojson";


    console.log(
      "Tentando carregar:",
      arquivo
    );


    /* ========================================================
       4. CARREGAR GEOJSON
       ======================================================== */

    fetch(arquivo)

      .then(
        function (resposta) {

          console.log(
            "Resposta HTTP:",
            resposta.status
          );


          if (!resposta.ok) {

            throw new Error(
              "Erro HTTP " +
              resposta.status
            );

          }


          return resposta.json();

        }
      )

      .then(
        function (dados) {

          console.log(
            "GeoJSON carregado:"
          );

          console.log(dados);


          console.log(
            "Número de feições:",
            dados.features.length
          );


          /* ==================================================
             5. ADICIONAR POLÍGONOS
             ================================================== */

          const camada =
            L.geoJSON(
              dados,
              {

                style:
                  function () {

                    return {

                      color: "#000000",

                      weight: 2,

                      fillColor: "#ff0000",

                      fillOpacity: 0.6

                    };

                  }

              }
            );


          camada.addTo(mapa);


          /* ==================================================
             6. AJUSTAR EXTENSÃO
             ================================================== */

          const limites =
            camada.getBounds();


          console.log(
            "Limites:",
            limites
          );


          if (
            limites.isValid()
          ) {

            mapa.fitBounds(
              limites
            );

          }


          console.log(
            "POLÍGONOS ADICIONADOS!"
          );

        }
      )

      .catch(
        function (erro) {

          console.error(
            "ERRO AO CARREGAR GEOJSON:",
            erro
          );


          const mensagem =
            document.createElement(
              "div"
            );


          mensagem.style.cssText = `
            background:#f8d7da;
            color:#721c24;
            padding:15px;
            margin-top:15px;
            border-radius:8px;
            font-family:Arial;
          `;


          mensagem.innerHTML = `
            <strong>Erro ao carregar o GeoJSON</strong><br><br>
            ${erro.message}
            <br><br>
            Verifique o console do navegador.
          `;


          document
            .getElementById("mapa")
            .parentNode
            .appendChild(mensagem);

        }
      );

  }

);

</script>
