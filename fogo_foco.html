<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <title>Ranking de Área Queimada 2024/2025</title>


  <!-- ===================================================== -->
  <!-- LEAFLET -->
  <!-- ===================================================== -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <!-- ===================================================== -->
  <!-- ESTILO -->
  <!-- ===================================================== -->

  <style>

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f5f5f5;

    }


    h2 {

      margin: 20px;

    }


    #mapa {

      width: 100%;

      height: 700px;

    }

  </style>

</head>


<body>


<h2>
  Ranking de Área Queimada 2024/2025
</h2>


<!-- ===================================================== -->
<!-- MAPA -->
<!-- ===================================================== -->

<div id="mapa"></div>


<script>


// ============================================================
// 1. CRIAR MAPA
// ============================================================

const mapa = L.map("mapa").setView(

  [-14.2, -51.9],

  4

);


// ============================================================
// 2. MAPA BASE
// ============================================================

L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    attribution:
      "&copy; OpenStreetMap contributors"

  }

).addTo(mapa);


// ============================================================
// 3. ARQUIVOS DOS ESTADOS
// ============================================================

const arquivosEstados = [

  "estados_2024_01.geojson",

  "estados_2024_02.geojson",

  "estados_2024_03.geojson"

];


// ============================================================
// 4. ARQUIVOS DOS BIOMAS
// ============================================================

const arquivosBiomas = [

  "biomas_2024_01.geojson",

  "biomas_2024_02.geojson",

  "biomas_2024_03.geojson",

  "biomas_2024_04.geojson",

  "biomas_2024_05.geojson"

];


// ============================================================
// 5. ARQUIVOS DAS TERRAS INDÍGENAS
// ============================================================

const arquivosTI = [

  "terras_indigenas_2024_01.geojson",

  "terras_indigenas_2024_02.geojson",

  "terras_indigenas_2024_03.geojson",

  "terras_indigenas_2024_04.geojson"

];


// ============================================================
// 6. ARQUIVOS DAS UNIDADES DE CONSERVAÇÃO
// ============================================================

const arquivosUC = [

  "unidades_conservacao_2024_01.geojson",

  "unidades_conservacao_2024_02.geojson",

  "unidades_conservacao_2024_03.geojson",

  "unidades_conservacao_2024_04.geojson"

];


// ============================================================
// 7. FUNÇÃO PARA CARREGAR OS ARQUIVOS
// ============================================================

async function carregarArquivos(

  listaArquivos,

  nomeCamada

) {


  console.log(
    "======================================"
  );


  console.log(

    "Carregando:",
    nomeCamada

  );


  // ----------------------------------------------------------
  // CARREGAR TODOS OS ARQUIVOS
  // ----------------------------------------------------------

  const resultados = await Promise.all(

    listaArquivos.map(

      arquivo =>

        fetch(arquivo)

          .then(response => {


            console.log(

              arquivo,

              "Status:",

              response.status

            );


            if (!response.ok) {

              throw new Error(

                "Erro HTTP " +

                response.status +

                " em " +

                arquivo

              );

            }


            return response.json();

          })

    )

  );


  // ----------------------------------------------------------
  // JUNTAR TODAS AS FEATURES
  // ----------------------------------------------------------

  let features = [];


  resultados.forEach(

    geojson => {


      if (

        geojson &&

        geojson.features &&

        Array.isArray(

          geojson.features

        )

      ) {


        features =

          features.concat(

            geojson.features

          );

      }

    }

  );


  // ----------------------------------------------------------
  // CRIAR FEATURE COLLECTION FINAL
  // ----------------------------------------------------------

  const resultadoFinal = {

    type: "FeatureCollection",

    features: features

  };


  // ----------------------------------------------------------
  // CONTAGEM
  // ----------------------------------------------------------

  console.log(

    nomeCamada +

    ":",

    features.length,

    "dados"

  );


  console.log(

    "Arquivos utilizados:",

    listaArquivos.length

  );


  return resultadoFinal;

}


// ============================================================
// 8. ESTILO DOS ESTADOS
// ============================================================

const estiloEstados = {

  color: "#000000",

  weight: 1.5,

  fillColor: "#e74c3c",

  fillOpacity: 0.25

};


// ============================================================
// 9. ESTILO DOS BIOMAS
// ============================================================

const estiloBiomas = {

  color: "#008000",

  weight: 2,

  fillColor: "#2ecc71",

  fillOpacity: 0.20

};


// ============================================================
// 10. ESTILO DAS TERRAS INDÍGENAS
// ============================================================

const estiloTI = {

  color: "#8e44ad",

  weight: 1.5,

  fillColor: "#9b59b6",

  fillOpacity: 0.20

};


// ============================================================
// 11. ESTILO DAS UNIDADES DE CONSERVAÇÃO
// ============================================================

const estiloUC = {

  color: "#2980b9",

  weight: 1.5,

  fillColor: "#3498db",

  fillOpacity: 0.20

};


// ============================================================
// 12. GRUPOS DAS CAMADAS
// ============================================================

const grupoEstados =

  L.layerGroup();


const grupoBiomas =

  L.layerGroup();


const grupoTI =

  L.layerGroup();


const grupoUC =

  L.layerGroup();


// ============================================================
// 13. VARIÁVEIS PARA GUARDAR OS GEOJSON
// ============================================================

let dadosEstados = null;

let dadosBiomas = null;

let dadosTI = null;

let dadosUC = null;


// ============================================================
// 14. CARREGAR ESTADOS
// ============================================================

carregarArquivos(

  arquivosEstados,

  "Estados"

)

.then(data => {


  dadosEstados = data;


  const camada =

    L.geoJSON(

      data,

      {

        style:

          estiloEstados

      }

    );


  grupoEstados.addLayer(

    camada

  );


  console.log(

    "Estados adicionados ao mapa."

  );

})

.catch(error => {


  console.error(

    "ERRO NOS ESTADOS:",

    error

  );

});


// ============================================================
// 15. CARREGAR BIOMAS
// ============================================================

carregarArquivos(

  arquivosBiomas,

  "Biomas"

)

.then(data => {


  dadosBiomas = data;


  const camada =

    L.geoJSON(

      data,

      {

        style:

          estiloBiomas

      }

    );


  grupoBiomas.addLayer(

    camada

  );


  console.log(

    "Biomas adicionados ao mapa."

  );

})

.catch(error => {


  console.error(

    "ERRO NOS BIOMAS:",

    error

  );

});


// ============================================================
// 16. CARREGAR TERRAS INDÍGENAS
// ============================================================

carregarArquivos(

  arquivosTI,

  "Terras Indígenas"

)

.then(data => {


  dadosTI = data;


  const camada =

    L.geoJSON(

      data,

      {

        style:

          estiloTI

      }

    );


  grupoTI.addLayer(

    camada

  );


  console.log(

    "Terras Indígenas adicionadas ao mapa."

  );

})

.catch(error => {


  console.error(

    "ERRO NAS TERRAS INDÍGENAS:",

    error

  );

});


// ============================================================
// 17. CARREGAR UNIDADES DE CONSERVAÇÃO
// ============================================================

carregarArquivos(

  arquivosUC,

  "Unidades de Conservação"

)

.then(data => {


  dadosUC = data;


  const camada =

    L.geoJSON(

      data,

      {

        style:

          estiloUC

      }

    );


  grupoUC.addLayer(

    camada

  );


  console.log(

    "Unidades de Conservação adicionadas ao mapa."

  );

})

.catch(error => {


  console.error(

    "ERRO NAS UNIDADES DE CONSERVAÇÃO:",

    error

  );

});


// ============================================================
// 18. CONTROLE DE CAMADAS
// ============================================================

const controleCamadas = {


  "Estados":

    grupoEstados,


  "Biomas":

    grupoBiomas,


  "Terras Indígenas":

    grupoTI,


  "Unidades de Conservação":

    grupoUC

};


// ============================================================
// 19. ADICIONAR CONTROLE AO MAPA
// ============================================================

L.control.layers(

  null,

  controleCamadas,

  {

    collapsed: false

  }

).addTo(mapa);


// ============================================================
// 20. MENSAGEM INICIAL
// ============================================================

console.log(

  "======================================"

);


console.log(

  "DASHBOARD INICIADO"

);


console.log(

  "Carregando Regional Layers..."

);


console.log(

  "======================================"

);

</script>


</body>

</html>
