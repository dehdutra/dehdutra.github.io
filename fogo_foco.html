<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <title>Ranking de Área Queimada 2024/2025</title>


  <!-- ===================================================== -->
  <!-- LEAFLET -->
  <!-- ===================================================== -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <!-- ===================================================== -->
  <!-- ESTILO -->
  <!-- ===================================================== -->

  <style>

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f5f5f5;

    }


    h2 {

      margin: 20px;

    }


    #mapa {

      width: 100%;

      height: 700px;

    }


    /* ===================================================== */
    /* LEGENDA */
    /* ===================================================== */

    .legenda-ranking {

      background: white;

      padding: 12px;

      border-radius: 8px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.25);

      line-height: 18px;

      font-size: 12px;

    }


    .legenda-ranking h4 {

      margin:

        0 0 8px 0;

      font-size: 14px;

    }


    .item-legenda {

      display: flex;

      align-items: center;

      margin: 3px 0;

    }


    .cor-legenda {

      width: 22px;

      height: 14px;

      margin-right: 7px;

      border: 1px solid #777;

    }

  </style>

</head>


<body>


<h2>
  Ranking de Área Queimada 2024/2025
</h2>


<!-- ===================================================== -->
<!-- MAPA -->
<!-- ===================================================== -->

<div id="mapa"></div>


<script>


// ============================================================
// 1. CRIAR MAPA
// ============================================================

const mapa = L.map("mapa").setView(

  [-14.2, -51.9],

  4

);


// ============================================================
// 2. MAPA BASE
// ============================================================

L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    attribution:
      "&copy; OpenStreetMap contributors"

  }

).addTo(mapa);


// ============================================================
// 3. ARQUIVOS DOS ESTADOS
// ============================================================

const arquivosEstados = [

  "estados_2024_01.geojson",

  "estados_2024_02.geojson",

  "estados_2024_03.geojson"

];


// ============================================================
// 4. ARQUIVOS DOS BIOMAS
// ============================================================

const arquivosBiomas = [

  "biomas_2024_01.geojson",

  "biomas_2024_02.geojson",

  "biomas_2024_03.geojson",

  "biomas_2024_04.geojson",

  "biomas_2024_05.geojson"

];


// ============================================================
// 5. ARQUIVOS DAS TERRAS INDÍGENAS
// ============================================================

const arquivosTI = [

  "terras_indigenas_2024_01.geojson",

  "terras_indigenas_2024_02.geojson",

  "terras_indigenas_2024_03.geojson",

  "terras_indigenas_2024_04.geojson"

];


// ============================================================
// 6. ARQUIVOS DAS UNIDADES DE CONSERVAÇÃO
// ============================================================

const arquivosUC = [

  "unidades_conservacao_2024_01.geojson",

  "unidades_conservacao_2024_02.geojson",

  "unidades_conservacao_2024_03.geojson",

  "unidades_conservacao_2024_04.geojson"

];


// ============================================================
// 7. FUNÇÃO PARA CARREGAR VÁRIOS ARQUIVOS
// ============================================================

async function carregarArquivos(

  listaArquivos,

  nomeCamada

) {

  console.log(
    "======================================"
  );

  console.log(
    "Carregando:",
    nomeCamada
  );


  // ----------------------------------------------------------
  // CARREGAR ARQUIVOS
  // ----------------------------------------------------------

  const resultados = await Promise.all(

    listaArquivos.map(

      arquivo =>

        fetch(arquivo)

          .then(response => {


            console.log(

              arquivo,

              "Status:",

              response.status

            );


            if (!response.ok) {

              throw new Error(

                "Erro HTTP " +

                response.status +

                " em " +

                arquivo

              );

            }


            return response.json();

          })

    )

  );


  // ----------------------------------------------------------
  // JUNTAR FEATURES
  // ----------------------------------------------------------

  let features = [];


  resultados.forEach(

    geojson => {


      if (

        geojson &&

        geojson.features &&

        Array.isArray(

          geojson.features

        )

      ) {

        features =

          features.concat(

            geojson.features

          );

      }

    }

  );


  // ----------------------------------------------------------
  // FEATURE COLLECTION FINAL
  // ----------------------------------------------------------

  const resultadoFinal = {

    type: "FeatureCollection",

    features: features

  };


  console.log(

    nomeCamada +

    ":",

    features.length,

    "dados"

  );


  return resultadoFinal;

}


// ============================================================
// 8. ESCALA DE CORES DO RANKING
// ============================================================

function corRanking(rank) {


  // ----------------------------------------------------------
  // Converter para número
  // ----------------------------------------------------------

  const r = Number(rank);


  // ----------------------------------------------------------
  // Sem ranking
  // ----------------------------------------------------------

  if (

    !Number.isFinite(r)

  ) {

    return "#ffffff";

  }


  // ==========================================================
  // 1º A 5º
  // VERMELHO → AMARELO
  // ==========================================================

  if (r === 1) {

    return "#7f0000";

  }


  if (r === 2) {

    return "#b30000";

  }


  if (r === 3) {

    return "#d7301f";

  }


  if (r === 4) {

    return "#ef6548";

  }


  if (r === 5) {

    return "#fdae61";

  }


  // ==========================================================
  // 6º A 18º
  // CINZA
  // ==========================================================

  if (

    r >= 6 &&

    r <= 18

  ) {

    return "#bdbdbd";

  }


  // ==========================================================
  // 19º A 24º
  // AZUL CLARO → AZUL ESCURO
  // ==========================================================

  if (r === 19) {

    return "#c6dbef";

  }


  if (r === 20) {

    return "#9ecae1";

  }


  if (r === 21) {

    return "#6baed6";

  }


  if (r === 22) {

    return "#4292c6";

  }


  if (r === 23) {

    return "#2171b5";

  }


  if (r === 24) {

    return "#084594";

  }


  // ----------------------------------------------------------
  // Caso exista ranking fora da faixa
  // ----------------------------------------------------------

  return "#ffffff";

}


// ============================================================
// 9. ESTILO BASE DAS FEATURES
// ============================================================

function estiloPorRanking(

  feature

) {


  // ----------------------------------------------------------
  // Pegar ranking
  // ----------------------------------------------------------

  const propriedades =

    feature.properties || {};


  const rank =

    propriedades[
      "Burned Area Rank"
    ];


  const cor =

    corRanking(rank);


  return {

    color: "#555555",

    weight: 1,

    fillColor: cor,

    fillOpacity: 0.70

  };

}


// ============================================================
// 10. GRUPOS DAS CAMADAS
// ============================================================

const grupoEstados =

  L.layerGroup();


const grupoBiomas =

  L.layerGroup();


const grupoTI =

  L.layerGroup();


const grupoUC =

  L.layerGroup();


// ============================================================
// 11. DADOS CARREGADOS
// ============================================================

let dadosEstados = null;

let dadosBiomas = null;

let dadosTI = null;

let dadosUC = null;


// ============================================================
// 12. FUNÇÃO PARA MOSTRAR POPUP
// ============================================================

function popupRanking(

  feature,

  layer

) {


  const p =

    feature.properties || {};


  const rank =

    p["Burned Area Rank"];


  const area =

    p["Burned Area (km^2)"];


  const nome =

    p["Region Name"] ||

    p["region_nam"] ||

    p["NAME_1"] ||

    p["NM_ESTADO"] ||

    "Região";


  let texto =

    "<strong>" +

    nome +

    "</strong><br><br>";


  if (

    rank !== undefined &&

    rank !== null

  ) {

    texto +=

      "<strong>Ranking:</strong> " +

      rank +

      "º<br>";

  }


  if (

    area !== undefined &&

    area !== null

  ) {

    texto +=

      "<strong>Área queimada:</strong> " +

      Number(area).toLocaleString(

        "pt-BR",

        {

          maximumFractionDigits: 2

        }

      ) +

      " km²";

  }


  layer.bindPopup(texto);

}


// ============================================================
// 13. CARREGAR ESTADOS
// ============================================================

carregarArquivos(

  arquivosEstados,

  "Estados"

)

.then(data => {


  dadosEstados = data;


  const camada =

    L.geoJSON(

      data,

      {

        style:

          estiloPorRanking,


        onEachFeature:

          popupRanking

      }

    );


  grupoEstados.addLayer(

    camada

  );


  console.log(

    "Estados adicionados."

  );

})

.catch(error => {


  console.error(

    "ERRO NOS ESTADOS:",

    error

  );

});


// ============================================================
// 14. CARREGAR BIOMAS
// ============================================================

carregarArquivos(

  arquivosBiomas,

  "Biomas"

)

.then(data => {


  dadosBiomas = data;


  const camada =

    L.geoJSON(

      data,

      {

        style:

          estiloPorRanking,


        onEachFeature:

          popupRanking

      }

    );


  grupoBiomas.addLayer(

    camada

  );


  console.log(

    "Biomas adicionados."

  );

})

.catch(error => {


  console.error(

    "ERRO NOS BIOMAS:",

    error

  );

});


// ============================================================
// 15. CARREGAR TERRAS INDÍGENAS
// ============================================================

carregarArquivos(

  arquivosTI,

  "Terras Indígenas"

)

.then(data => {


  dadosTI = data;


  const camada =

    L.geoJSON(

      data,

      {

        style:

          estiloPorRanking,


        onEachFeature:

          popupRanking

      }

    );


  grupoTI.addLayer(

    camada

  );


  console.log(

    "Terras Indígenas adicionadas."

  );

})

.catch(error => {


  console.error(

    "ERRO NAS TERRAS INDÍGENAS:",

    error

  );

});


// ============================================================
// 16. CARREGAR UNIDADES DE CONSERVAÇÃO
// ============================================================

carregarArquivos(

  arquivosUC,

  "Unidades de Conservação"

)

.then(data => {


  dadosUC = data;


  const camada =

    L.geoJSON(

      data,

      {

        style:

          estiloPorRanking,


        onEachFeature:

          popupRanking

      }

    );


  grupoUC.addLayer(

    camada

  );


  console.log(

    "Unidades de Conservação adicionadas."

  );

})

.catch(error => {


  console.error(

    "ERRO NAS UNIDADES DE CONSERVAÇÃO:",

    error

  );

});


// ============================================================
// 17. CONTROLE DE CAMADAS
// ============================================================

const controleCamadas = {


  "Estados":

    grupoEstados,


  "Biomas":

    grupoBiomas,


  "Terras Indígenas":

    grupoTI,


  "Unidades de Conservação":

    grupoUC

};


// ============================================================
// 18. ADICIONAR CONTROLE
// ============================================================

L.control.layers(

  null,

  controleCamadas,

  {

    collapsed: false

  }

).addTo(mapa);


// ============================================================
// 19. LEGENDA
// ============================================================

const legenda =

  L.control({

    position: "bottomright"

  });


legenda.onAdd =

  function() {


    const div =

      L.DomUtil.create(

        "div",

        "legenda-ranking"

      );


    div.innerHTML =

      "<h4>Ranking de área queimada</h4>";


    // --------------------------------------------------------
    // 1º
    // --------------------------------------------------------

    div.innerHTML +=

      itemLegenda(

        "#7f0000",

        "1º"

      );


    // --------------------------------------------------------
    // 2º
    // --------------------------------------------------------

    div.innerHTML +=

      itemLegenda(

        "#b30000",

        "2º"

      );


    // --------------------------------------------------------
    // 3º
    // --------------------------------------------------------

    div.innerHTML +=

      itemLegenda(

        "#d7301f",

        "3º"

      );


    // --------------------------------------------------------
    // 4º
    // --------------------------------------------------------

    div.innerHTML +=

      itemLegenda(

        "#ef6548",

        "4º"

      );


    // --------------------------------------------------------
    // 5º
    // --------------------------------------------------------

    div.innerHTML +=

      itemLegenda(

        "#fdae61",

        "5º"

      );


    // --------------------------------------------------------
    // CINZA
    // --------------------------------------------------------

    div.innerHTML +=

      itemLegenda(

        "#bdbdbd",

        "6º–18º"

      );


    // --------------------------------------------------------
    // AZUIS
    // --------------------------------------------------------

    div.innerHTML +=

      itemLegenda(

        "#c6dbef",

        "19º"

      );


    div.innerHTML +=

      itemLegenda(

        "#9ecae1",

        "20º"

      );


    div.innerHTML +=

      itemLegenda(

        "#6baed6",

        "21º"

      );


    div.innerHTML +=

      itemLegenda(

        "#4292c6",

        "22º"

      );


    div.innerHTML +=

      itemLegenda(

        "#2171b5",

        "23º"

      );


    div.innerHTML +=

      itemLegenda(

        "#084594",

        "24º"

      );


    return div;

  };


// ============================================================
// 20. FUNÇÃO DA LEGENDA
// ============================================================

function itemLegenda(

  cor,

  texto

) {


  return `

    <div class="item-legenda">

      <span

        class="cor-legenda"

        style="background:${cor};">

      </span>

      <span>${texto}</span>

    </div>

  `;

}


// ============================================================
// 21. ADICIONAR LEGENDA AO MAPA
// ============================================================

legenda.addTo(mapa);


// ============================================================
// 22. MENSAGEM NO CONSOLE
// ============================================================

console.log(

  "======================================"

);


console.log(

  "DASHBOARD INICIADO"

);


console.log(

  "Escala de ranking ativada."

);


console.log(

  "Todas as Regional Layers usam a mesma escala."

);


console.log(

  "======================================"

);

</script>


</body>

</html>
