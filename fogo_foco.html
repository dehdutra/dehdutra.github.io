<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <title>Teste - Estados</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

</head>

<body>

<h2>Teste dos Estados</h2>

<div
  id="mapa"
  style="
    width:100%;
    height:600px;
  ">
</div>


<script>

// ============================================================
// 1. CRIAR MAPA
// ============================================================

const mapa = L.map("mapa").setView(
  [-14.2, -51.9],
  4
);


// ============================================================
// 2. MAPA BASE
// ============================================================

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution:
      "&copy; OpenStreetMap contributors"
  }
).addTo(mapa);


// ============================================================
// 3. CARREGAR GEOJSON
// ============================================================

fetch("estados_2024_01.geojson")

  .then(response => {

    console.log(
      "Status do arquivo:",
      response.status
    );

    if (!response.ok) {

      throw new Error(
        "Erro HTTP " + response.status
      );

    }

    return response.json();

  })

  .then(data => {

    console.log(
      "GeoJSON carregado:",
      data
    );

    console.log(
      "Número de feições:",
      data.features.length
    );


    // ========================================================
    // 4. CRIAR POLÍGONOS
    // ========================================================

    const camada = L.geoJSON(
      data,
      {

        style: {

          color: "#000000",

          weight: 2,

          fillColor: "#ff0000",

          fillOpacity: 0.6

        }

      }
    );


    // ========================================================
    // 5. ADICIONAR AO MAPA
    // ========================================================

    camada.addTo(mapa);


    // ========================================================
    // 6. AJUSTAR ZOOM
    // ========================================================

    if (
      camada.getBounds().isValid()
    ) {

      mapa.fitBounds(
        camada.getBounds()
      );

    }


    console.log(
      "POLÍGONOS CARREGADOS!"
    );

  })

  .catch(error => {

    console.error(
      "ERRO AO CARREGAR GEOJSON:",
      error
    );

  });

</script>

</body>

</html>
