<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard de Área Queimada</title>


    <!-- ==========================================================
         LEAFLET
    =========================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- ==========================================================
         ESTILO
    =========================================================== -->

    <style>

        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f6f8;

        }


        /* ======================================================
           MAPA
        ====================================================== */

        #mapa {

            width: 100%;

            height: 100vh;

        }


        /* ======================================================
           LEGENDA
        ====================================================== */

        .legenda-ranking {

            background: white;

            padding: 12px 14px;

            line-height: 20px;

            color: #333;

            box-shadow:
                0 0 8px rgba(0,0,0,0.25);

            border-radius: 6px;

            font-size: 13px;

        }


        .legenda-ranking strong {

            display: block;

            margin-bottom: 6px;

            font-size: 14px;

        }


        .legenda-ranking div {

            display: flex;

            align-items: center;

        }


        .legenda-ranking i {

            width: 18px;

            height: 18px;

            margin-right: 7px;

            display: inline-block;

            border: 1px solid #999;

            box-sizing: border-box;

        }


        /* ======================================================
           CONTROLE DE CAMADAS
        ====================================================== */

        .leaflet-control-layers {

            font-size: 14px;

        }


        .leaflet-control-layers-expanded {

            padding: 10px 12px;

        }

    </style>

</head>


<body>


<!-- ==========================================================
     MAPA
=========================================================== -->

<div id="mapa"></div>


<script>


// ============================================================
// 1. MAPA
// ============================================================

const mapa = L.map("mapa").setView(

    [-14.2, -51.9],

    4

);


// ============================================================
// 2. MAPA BASE
// ============================================================

L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        attribution:
            "&copy; OpenStreetMap contributors",

        maxZoom: 18

    }

).addTo(mapa);



// ============================================================
// 3. ARQUIVOS DOS ESTADOS
// ============================================================

const arquivosEstados = [

    "estados_2024_01.geojson",

    "estados_2024_02.geojson",

    "estados_2024_03.geojson"

];



// ============================================================
// 4. ARQUIVOS DOS BIOMAS
// ============================================================

const arquivosBiomas = [

    "biomas_2024_01.geojson",

    "biomas_2024_02.geojson",

    "biomas_2024_03.geojson",

    "biomas_2024_04.geojson",

    "biomas_2024_05.geojson"

];



// ============================================================
// 5. NORMALIZAR TEXTO
// ============================================================

function normalizarTexto(valor) {

    if (

        valor === null ||

        valor === undefined

    ) {

        return "";

    }


    return String(valor)

        .trim()

        .toLowerCase()

        .normalize("NFD")

        .replace(

            /[\u0300-\u036f]/g,

            ""

        );

}



// ============================================================
// 6. OBTER NOME DA FEIÇÃO
// ============================================================

function obterNome(feature) {

    const p =
        feature.properties || {};


    const camposNome = [

        "region_nam",

        "Region Name",

        "NAME_1",

        "NM_ESTADO",

        "NM_UF",

        "NAME",

        "nome",

        "Nome",

        "name",

        "NAME_0",

        "Region"

    ];


    for (

        const campo of camposNome

    ) {

        if (

            p[campo] !== undefined &&

            p[campo] !== null &&

            String(p[campo]).trim() !== ""

        ) {

            return String(
                p[campo]
            );

        }

    }


    return "Sem nome";

}



// ============================================================
// 7. VERIFICAR SE É BRASIL
// ============================================================

function ehBrasil(feature) {

    const p =
        feature.properties || {};


    /*
       Primeiro procuramos algum campo
       que identifique o país.
    */

    const camposPais =
        Object.keys(p).filter(

            campo => {

                const campoNormalizado =

                    normalizarTexto(campo)

                        .replace(
                            /[^a-z0-9]/g,
                            ""
                        );


                return [

                    "country",

                    "pais",

                    "name0",

                    "countryname",

                    "nomepais",

                    "nomedopais"

                ].includes(

                    campoNormalizado

                );

            }

        );


    /*
       Se o arquivo possuir campo de país,
       utilizamos esse campo.
    */

    if (
        camposPais.length > 0
    ) {

        for (

            const campo of camposPais

        ) {

            const pais =

                normalizarTexto(
                    p[campo]
                );


            if (

                pais === "brazil" ||

                pais === "brasil"

            ) {

                return true;

            }

        }


        return false;

    }


    /*
       Caso não exista campo de país,
       usamos a lista de estados brasileiros.

       Isso evita eliminar os estados
       quando o GeoJSON não possui COUNTRY.
    */

    const estadosBrasil = new Set([

        "acre",

        "alagoas",

        "amapa",

        "amazonas",

        "bahia",

        "ceara",

        "distrito federal",

        "espirito santo",

        "goias",

        "maranhao",

        "mato grosso",

        "mato grosso do sul",

        "minas gerais",

        "para",

        "paraiba",

        "parana",

        "pernambuco",

        "piaui",

        "rio de janeiro",

        "rio grande do norte",

        "rio grande do sul",

        "rondonia",

        "roraima",

        "santa catarina",

        "sao paulo",

        "sergipe",

        "tocantins"

    ]);


    return estadosBrasil.has(

        normalizarTexto(
            obterNome(feature)
        )

    );

}



// ============================================================
// 8. OBTER RANKING
// ============================================================

function obterRanking(feature) {

    const p =
        feature.properties || {};


    const camposRanking = [

        "Rank_Category",

        "Burned Area Rank",

        "Burned_Area_Rank",

        "Ranking",

        "ranking",

        "Rank",

        "rank"

    ];


    for (

        const campo of camposRanking

    ) {

        if (

            p[campo] !== undefined &&

            p[campo] !== null &&

            p[campo] !== ""

        ) {

            const valor =

                Number(
                    p[campo]
                );


            if (
                Number.isFinite(valor)
            ) {

                return valor;

            }

        }

    }


    return null;

}



// ============================================================
// 9. OBTER ÁREA QUEIMADA
// ============================================================

function obterArea(feature) {

    const p =
        feature.properties || {};


    const camposArea = [

        "Burned Area (km^2)",

        "Burned_Area_km2",

        "Burned Area",

        "burned_area",

        "area_queimada",

        "Area Queimada"

    ];


    for (

        const campo of camposArea

    ) {

        if (

            p[campo] !== undefined &&

            p[campo] !== null &&

            p[campo] !== ""

        ) {

            const valor =

                Number(
                    p[campo]
                );


            if (
                Number.isFinite(valor)
            ) {

                return valor;

            }

        }

    }


    return null;

}



// ============================================================
// 10. CORES DO RANKING
// ============================================================

function corRanking(rank) {

    if (

        rank === null ||

        rank === undefined

    ) {

        return "#cccccc";

    }


    rank =
        Number(rank);


    if (rank === 1)
        return "#7f0000";


    if (rank === 2)
        return "#b30000";


    if (rank === 3)
        return "#d7301f";


    if (rank === 4)
        return "#ef6548";


    if (rank === 5)
        return "#fdae61";


    if (

        rank >= 6 &&

        rank <= 18

    )

        return "#bdbdbd";


    if (rank === 19)
        return "#c6dbef";


    if (rank === 20)
        return "#9ecae1";


    if (rank === 21)
        return "#6baed6";


    if (rank === 22)
        return "#4292c6";


    if (rank === 23)
        return "#2171b5";


    if (rank === 24)
        return "#084594";


    return "#cccccc";

}



// ============================================================
// 11. ESTILO DOS POLÍGONOS
// ============================================================

function estiloPorRanking(feature) {

    const rank =
        obterRanking(feature);


    return {

        fillColor:
            corRanking(rank),

        weight: 1,

        opacity: 1,

        color: "#555",

        fillOpacity: 0.75

    };

}



// ============================================================
// 12. ESCAPAR HTML
// ============================================================

function escaparHTML(valor) {

    if (

        valor === null ||

        valor === undefined

    ) {

        return "";

    }


    return String(valor)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ============================================================
// 13. FORMATAÇÃO DA ÁREA
// ============================================================

function formatarArea(valor) {

    if (

        valor === null ||

        valor === undefined ||

        !Number.isFinite(Number(valor))

    ) {

        return "Não disponível";

    }


    return Number(valor).toLocaleString(

        "pt-BR",

        {

            minimumFractionDigits: 2,

            maximumFractionDigits: 2

        }

    );

}



// ============================================================
// 14. POPUP
// ============================================================

function popupRanking(

    feature,

    layer

) {

    const nome =
        obterNome(feature);


    const rank =
        obterRanking(feature);


    const area =
        obterArea(feature);


    let html = `

        <strong>

            ${escaparHTML(nome)}

        </strong>

        <br><br>

    `;


    if (
        rank !== null
    ) {

        html += `

            <b>Ranking:</b>

            ${rank}

            <br>

        `;

    }


    if (
        area !== null
    ) {

        html += `

            <b>Área queimada:</b>

            ${formatarArea(area)}

            km²

        `;

    }


    layer.bindPopup(
        html
    );

}



// ============================================================
// 15. GRUPOS DAS CAMADAS
// ============================================================

const grupoEstados =
    L.layerGroup();


const grupoBiomas =
    L.layerGroup();



// ============================================================
// 16. CARREGAR ARQUIVOS
// ============================================================

async function carregarArquivos(

    listaArquivos,

    somenteBrasil = false

) {

    let todasFeatures = [];


    for (

        const arquivo of listaArquivos

    ) {

        try {

            console.log(
                "Carregando:",
                arquivo
            );


            const resposta =
                await fetch(
                    arquivo
                );


            if (!resposta.ok) {

                throw new Error(

                    `Erro HTTP ${resposta.status}`

                );

            }


            const dados =
                await resposta.json();


            let features =
                dados.features || [];


            console.log(

                `${arquivo}: ${features.length} feições`

            );


            // ==================================================
            // FILTRO BRASIL
            // ==================================================

            if (somenteBrasil) {

                const totalAntes =
                    features.length;


                features =
                    features.filter(

                        feature =>
                            ehBrasil(feature)

                    );


                console.log(

                    `${arquivo}: ${features.length} feições brasileiras de ${totalAntes}`

                );

            }


            /*
               IMPORTANTE:

               Não removemos duplicados aqui.

               Os arquivos podem representar partes
               espaciais diferentes da camada.
            */

            todasFeatures.push(

                ...features

            );

        }

        catch (erro) {

            console.error(

                `Erro ao carregar ${arquivo}:`,

                erro

            );

        }

    }


    console.log(

        "Total de feições carregadas:",

        todasFeatures.length

    );


    return {

        type:
            "FeatureCollection",

        features:
            todasFeatures

    };

}



// ============================================================
// 17. CRIAR CAMADA GEOJSON
// ============================================================

function criarCamada(data) {

    return L.geoJSON(

        data,

        {

            style:
                estiloPorRanking,

            onEachFeature:
                popupRanking

        }

    );

}



// ============================================================
// 18. CARREGAR ESTADOS
// ============================================================

carregarArquivos(

    arquivosEstados,

    true

).then(

    data => {

        const camada =
            criarCamada(data);


        grupoEstados.addLayer(
            camada
        );


        /*
           Estados ficam visíveis inicialmente.
        */

        grupoEstados.addTo(
            mapa
        );


        console.log(

            "================================"

        );


        console.log(

            "ESTADOS CARREGADOS"

        );


        console.log(

            "Total:",

            data.features.length

        );


        console.log(

            "================================"

        );

    }

);



// ============================================================
// 19. CARREGAR BIOMAS
// ============================================================

carregarArquivos(

    arquivosBiomas,

    false

).then(

    data => {

        const camada =
            criarCamada(data);


        grupoBiomas.addLayer(
            camada
        );


        console.log(

            "================================"

        );


        console.log(

            "BIOMAS CARREGADOS"

        );


        console.log(

            "Total:",

            data.features.length

        );


        console.log(

            "================================"

        );

    }

);



// ============================================================
// 20. CONTROLE DE CAMADAS
// ============================================================

const controleCamadas = {

    "Estados":
        grupoEstados,

    "Biomas":
        grupoBiomas

};


L.control.layers(

    null,

    controleCamadas,

    {

        collapsed: false

    }

).addTo(mapa);



// ============================================================
// 21. LEGENDA DO RANKING
// ============================================================

const legenda =
    L.control({

        position:
            "bottomright"

    });



legenda.onAdd =
    function() {

        const div =
            L.DomUtil.create(

                "div",

                "legenda-ranking"

            );


        div.innerHTML = `

            <strong>
                Ranking de Área Queimada
            </strong>

            <div>
                <i style="background:#7f0000"></i>
                1
            </div>

            <div>
                <i style="background:#b30000"></i>
                2
            </div>

            <div>
                <i style="background:#d7301f"></i>
                3
            </div>

            <div>
                <i style="background:#ef6548"></i>
                4
            </div>

            <div>
                <i style="background:#fdae61"></i>
                5
            </div>

            <div>
                <i style="background:#bdbdbd"></i>
                6–18
            </div>

            <div>
                <i style="background:#c6dbef"></i>
                19
            </div>

            <div>
                <i style="background:#9ecae1"></i>
                20
            </div>

            <div>
                <i style="background:#6baed6"></i>
                21
            </div>

            <div>
                <i style="background:#4292c6"></i>
                22
            </div>

            <div>
                <i style="background:#2171b5"></i>
                23
            </div>

            <div>
                <i style="background:#084594"></i>
                24
            </div>

        `;


        return div;

    };


legenda.addTo(mapa);



// ============================================================
// 22. CONTROLE DO MOUSE NA LEGENDA
// ============================================================

L.DomEvent.disableClickPropagation(
    legenda.getContainer()
);

L.DomEvent.disableScrollPropagation(
    legenda.getContainer()
);



// ============================================================
// 23. CONTROLE DO MOUSE NO CONTROLE DE CAMADAS
// ============================================================

const controle =
    document.querySelector(
        ".leaflet-control-layers"
    );


if (controle) {

    L.DomEvent.disableClickPropagation(
        controle
    );

    L.DomEvent.disableScrollPropagation(
        controle
    );

}



</script>


</body>

</html>
