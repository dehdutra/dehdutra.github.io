
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste do mapa-múndi</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
    }

    h1 {
      padding: 16px;
      margin: 0;
      background: #13263e;
      color: white;
      font-size: 22px;
    }

    #mapa {
      width: 100%;
      height: calc(100vh - 60px);
      min-height: 400px;
      background: #dce8ef;
    }
  </style>
</head>
<body>

  <h1>Mapa-múndi</h1>
  <div id="mapa"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const mapa = L.map("mapa", {
      center: [15, 0],
      zoom: 2, 
      minZoom: 1,
      worldCopyJump: false
    });

    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
      {
        subdomains: "abcd",
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap &copy; CARTO"
      }
    ).addTo(mapa);

    setTimeout(() => mapa.invalidateSize(), 300);
  </script>

</body>
</html>
