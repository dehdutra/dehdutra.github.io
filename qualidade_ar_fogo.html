<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Focos de Calor & Qualidade do Ar</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet (Mapas) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body { background-color: #f8f9fa; }
        .map-container { height: 450px; width: 100%; border-radius: 8px; }
        .card-custom { border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* Legenda Leaflet com faixas de concentração PM2.5 */
        .info.legend {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 14px;
            font-size: 12px;
            line-height: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 6px;
            color: #222;
        }
        .info.legend i {
            width: 14px;
            height: 14px;
            float: left;
            margin-right: 8px;
            margin-top: 3px;
            opacity: 0.9;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="container-fluid py-4">
    <h2 class="mb-4 text-center">Dashboard: Queimadas e Qualidade do Ar</h2>

    <!-- Mapas Lado a Lado -->
    <div class="row mb-4">
        <!-- Mapa 1: INPE Focos AQUA (Apenas Diário) -->
        <div class="col-lg-6 mb-3">
            <div class="card card-custom p-3">
                <h5 class="card-title">Focos Diários (Satélites AQUA - INPE)</h5>
                <p class="text-muted small">Pontos de calor detectados na América do Sul.</p>
                <div id="mapa-focos" class="map-container"></div>
            </div>
        </div>

        <!-- Mapa 2: PurpleAir (Qualidade do Ar) -->
        <div class="col-lg-6 mb-3">
            <div class="card card-custom p-3">
                <h5 class="card-title">Qualidade do Ar (PurpleAir - PM2.5)</h5>
                <p class="text-muted small">Sensores coloridos pela concentração de partículas PM2.5.</p>
                <div id="mapa-purpleair" class="map-container"></div>
            </div>
        </div>
    </div>
</div>

<!-- Bibliotecas JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
    const PURPLEAIR_KEY = "A8B62FCE-CA6E-11F1-9E30-4201AC1DC129";
    const PROXY = "https://api.allorigins.win/raw?url=";

    // 1. Inicializar os Mapas
    const mapFocos = L.map('mapa-focos').setView([-14.235, -51.925], 4);
    const mapPurpleAir = L.map('mapa-purpleair').setView([-14.235, -51.925], 4);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OpenStreetMap' }).addTo(mapFocos);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OpenStreetMap' }).addTo(mapPurpleAir);

    // Formata a data para AAAAMMDD (Ex: 20261018)
    function formatarData(d) {
        const ano = d.getFullYear();
        const mes = String(d.getMonth() + 1).padStart(2, '0');
        const dia = String(d.getDate()).padStart(2, '0');
        return `${ano}${mes}${dia}`;
    }

    // 2. Plotar Focos Diários do INPE (Busca direta do CSV por data)
    async function carregarFocosDiarios() {
        const baseUrl = "https://dataserver-coids.inpe.br/queimadas/queimadas/focos/csv/diario/America_Sul/";
        
        // Gera as URLs dos últimos 4 dias (caso o de hoje ainda não tenha subido no servidor)
        let datasParaTestar = [];
        for (let i = 0; i < 4; i++) {
            let d = new Date();
            d.setDate(d.getDate() - i);
            datasParaTestar.push(`${baseUrl}focos_diario_${formatarData(d)}.csv`);
        }

        let carregou = false;

        for (const urlCsv of datasParaTestar) {
            if (carregou) break;

            await new Promise(resolve => {
                Papa.parse(PROXY + encodeURIComponent(urlCsv), {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: function(res) {
                        // Verifica se retornou dados válidos com a coluna lat
                        if (res.data && res.data.length > 0 && res.data[0].lat) {
                            res.data.forEach(item => {
                                const sat = (item.satelite || '').toUpperCase();
                                
                                // Filtra satélite AQUA (ex: AQUA M-M, AQUA M-T, Aqua)
                                if (sat.includes("AQUA")) {
                                    const lat = parseFloat(item.lat || item.latitude);
                                    const lon = parseFloat(item.lon || item.longitude);

                                    if (!isNaN(lat) && !isNaN(lon)) {
                                        L.circleMarker([lat, lon], {
                                            radius: 4,
                                            fillColor: '#ff2200',
                                            color: '#880000',
                                            weight: 1,
                                            fillOpacity: 0.8
                                        }).bindPopup(`
                                            <b>Satélite:</b> ${item.satelite}<br>
                                            <b>Data/Hora:</b> ${item.data_hora_gmt || ''}<br>
                                            <b>Local:</b> ${item.municipio || ''} - ${item.estado || ''}<br>
                                            <b>FRP:</b> ${item.frp || 'N/A'}
                                        `).addTo(mapFocos);
                                    }
                                }
                            });
                            carregou = true;
                        }
                        resolve();
                    },
                    error: () => resolve()
                });
            });
        }
    }

    // 3. Cores para o PM2.5 (PurpleAir) - MANTIDO INTEGRO
    function getCorPM25(pm) {
        if (pm <= 12.0) return '#00e400';
        if (pm <= 35.4) return '#ffff00';
        if (pm <= 55.4) return '#ff7e00';
        if (pm <= 150.4) return '#ff0000';
        if (pm <= 250.4) return '#8f3f97';
        return '#7e0023';
    }

    // 4. Ler Pontos do PurpleAir (América do Sul) - MANTIDO INTEGRO
    async function carregarPurpleAir() {
        const url = "https://api.purpleair.com/v1/sensors?fields=name,latitude,longitude,pm2.5_10minute&location_type=0&nwlng=-82.0&nwlat=13.0&selng=-32.0&selat=-56.0";

        try {
            const resp = await fetch(url, { headers: { "X-API-Key": PURPLEAIR_KEY } });
            const json = await resp.json();

            if (json && json.data && json.fields) {
                const iLat = json.fields.indexOf("latitude");
                const iLon = json.fields.indexOf("longitude");
                const iPm = json.fields.indexOf("pm2.5_10minute");
                const iNome = json.fields.indexOf("name");

                json.data.forEach(s => {
                    const lat = s[iLat];
                    const lon = s[iLon];
                    const pm25 = s[iPm];
                    const nome = s[iNome] || "Sensor";

                    if (lat && lon && pm25 !== null) {
                        L.circleMarker([lat, lon], {
                            radius: 6,
                            fillColor: getCorPM25(pm25),
                            color: '#000',
                            weight: 1,
                            fillOpacity: 0.85
                        }).bindPopup(`<b>${nome}</b><br>PM2.5: ${pm25} &micro;g/m&sup3;`).addTo(mapPurpleAir);
                    }
                });
            }
        } catch (e) {
            console.error("Erro ao carregar PurpleAir:", e);
        }
    }

    // 5. Legenda de Concentração PM2.5 no PurpleAir - MANTIDO INTEGRO
    function adicionarLegendaPurpleAir() {
        const legend = L.control({ position: 'bottomright' });

        legend.onAdd = function () {
            const div = L.DomUtil.create('div', 'info legend');
            
            const faixas = [
                { cor: '#00e400', rotulo: '0 - 12.0 &micro;g/m&sup3; (Boa)' },
                { cor: '#ffff00', rotulo: '12.1 - 35.4 &micro;g/m&sup3; (Moderada)' },
                { cor: '#ff7e00', rotulo: '35.5 - 55.4 &micro;g/m&sup3; (Insalubre p/ Sensíveis)' },
                { cor: '#ff0000', rotulo: '55.5 - 150.4 &micro;g/m&sup3; (Insalubre)' },
                { cor: '#8f3f97', rotulo: '150.5 - 250.4 &micro;g/m&sup3; (Muito Insalubre)' },
                { cor: '#7e0023', rotulo: '&gt; 250.5 &micro;g/m&sup3; (Perigosa)' }
            ];

            div.innerHTML = '<strong>Concentração PM2.5</strong><br>';
            faixas.forEach(item => {
                div.innerHTML += `<i style="background:${item.cor}"></i> ${item.rotulo}<br>`;
            });

            return div;
        };

        legend.addTo(mapPurpleAir);
    }

    // Executar chamadas ao carregar a página
    carregarFocosDiarios();
    carregarPurpleAir();
    adicionarLegendaPurpleAir();
</script>

</body>
</html>
