<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Focos de Calor & Qualidade do Ar</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet (Mapas) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body { background-color: #f8f9fa; }
        .map-container { height: 450px; width: 100%; border-radius: 8px; }
        .card-custom { border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* Legenda Leaflet com faixas de concentração PM2.5 */
        .info.legend {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 14px;
            font-size: 12px;
            line-height: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 6px;
            color: #222;
        }
        .info.legend i {
            width: 14px;
            height: 14px;
            float: left;
            margin-right: 8px;
            margin-top: 3px;
            opacity: 0.9;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="container-fluid py-4">
    <h2 class="mb-4 text-center">Dashboard: Queimadas e Qualidade do Ar</h2>

    <!-- Mapas Lado a Lado -->
    <div class="row mb-4">
        <!-- Mapa 1: INPE Focos AQUA -->
        <div class="col-lg-6 mb-3">
            <div class="card card-custom p-3">
                <h5 class="card-title">Focos Diários (Satélites AQUA - INPE)</h5>
                <p class="text-muted small">Pontos de calor detectados na América do Sul.</p>
                <div id="mapa-focos" class="map-container"></div>
            </div>
        </div>

        <!-- Mapa 2: PurpleAir -->
        <div class="col-lg-6 mb-3">
            <div class="card card-custom p-3">
                <h5 class="card-title">Qualidade do Ar (PurpleAir - PM2.5)</h5>
                <p class="text-muted small">Sensores coloridos pela concentração de partículas PM2.5.</p>
                <div id="mapa-purpleair" class="map-container"></div>
            </div>
        </div>
    </div>

    <!-- Relatório e Gráfico Mensal -->
    <div class="row">
        <div class="col-12">
            <div class="card card-custom p-3">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
                    <h5 class="card-title mb-0">Relatório Mensal de Focos por Estado</h5>
                    <div class="col-md-3 col-12 mt-2 mt-md-0">
                        <select id="select-estado" class="form-select">
                            <option value="">Selecione um Estado...</option>
                        </select>
                    </div>
                </div>
                <div style="height: 350px;">
                    <canvas id="graficoMensal"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bibliotecas JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
    const PURPLEAIR_KEY = "A8B62FCE-CA6E-11F1-9E30-4201AC1DC129";
    const PROXY = "https://api.allorigins.win/raw?url=";

    // 1. Inicializar os Mapas
    const mapFocos = L.map('mapa-focos').setView([-14.235, -51.925], 4);
    const mapPurpleAir = L.map('mapa-purpleair').setView([-14.235, -51.925], 4);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OpenStreetMap' }).addTo(mapFocos);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OpenStreetMap' }).addTo(mapPurpleAir);

    // Função para obter o último arquivo do diretório do INPE
    async function obterUltimoArquivoCsv(urlDiretorio) {
        try {
            const resp = await fetch(PROXY + encodeURIComponent(urlDiretorio));
            const html = await resp.text();
            
            const regex = /href="([^"]+\.csv)"/g;
            let match;
            let arquivos = [];
            
            while ((match = regex.exec(html)) !== null) {
                if (!match[1].startsWith('http')) {
                    arquivos.push(match[1]);
                }
            }

            if (arquivos.length > 0) {
                const ultimoArquivo = arquivos[arquivos.length - 1];
                return urlDiretorio + ultimoArquivo;
            }
        } catch (e) {
            console.error("Erro ao listar diretório do INPE:", e);
        }
        return null;
    }

    // 2. Ler Focos Diários do INPE (Satélite AQUA)
    async function carregarFocosDiarios() {
        const dirDiario = "https://dataserver-coids.inpe.br/queimadas/queimadas/focos/csv/diario/America_Sul/";
        const urlArquivoCsv = await obterUltimoArquivoCsv(dirDiario);

        if (!urlArquivoCsv) return;

        Papa.parse(PROXY + encodeURIComponent(urlArquivoCsv), {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(res) {
                if (res.data) {
                    res.data.forEach(item => {
                        const sat = (item.satelite || '').toUpperCase();
                        if (sat.includes("AQUA")) {
                            const lat = parseFloat(item.lat || item.latitude);
                            const lon = parseFloat(item.lon || item.longitude);
                            if (!isNaN(lat) && !isNaN(lon)) {
                                L.circleMarker([lat, lon], {
                                    radius: 4,
                                    fillColor: '#ff2200',
                                    color: '#880000',
                                    weight: 1,
                                    fillOpacity: 0.8
                                }).bindPopup(`
                                    <b>Satélite:</b> ${item.satelite}<br>
                                    <b>Data/Hora:</b> ${item.data_hora_gmt || ''}<br>
                                    <b>Local:</b> ${item.municipio || ''} - ${item.estado || ''}
                                `).addTo(mapFocos);
                            }
                        }
                    });
                }
            }
        });
    }

    // 3. Cores para o PM2.5 (PurpleAir)
    function getCorPM25(pm) {
        if (pm <= 12.0) return '#00e400'; // Boa (0.0 a 12.0)
        if (pm <= 35.4) return '#ffff00'; // Moderada (12.1 a 35.4)
        if (pm <= 55.4) return '#ff7e00'; // Ruim p/ grupos sensíveis (35.5 a 55.4)
        if (pm <= 150.4) return '#ff0000'; // Insalubre (55.5 a 150.4)
        if (pm <= 250.4) return '#8f3f97'; // Muito Insalubre (150.5 a 250.4)
        return '#7e0023'; // Perigosa (> 250.5)
    }

    // 4. Ler Pontos do PurpleAir (América do Sul)
    async function carregarPurpleAir() {
        const url = "https://api.purpleair.com/v1/sensors?fields=name,latitude,longitude,pm2.5_10minute&location_type=0&nwlng=-82.0&nwlat=13.0&selng=-32.0&selat=-56.0";

        try {
            const resp = await fetch(url, { headers: { "X-API-Key": PURPLEAIR_KEY } });
            const json = await resp.json();

            if (json && json.data && json.fields) {
                const iLat = json.fields.indexOf("latitude");
                const iLon = json.fields.indexOf("longitude");
                const iPm = json.fields.indexOf("pm2.5_10minute");
                const iNome = json.fields.indexOf("name");

                json.data.forEach(s => {
                    const lat = s[iLat];
                    const lon = s[iLon];
                    const pm25 = s[iPm];
                    const nome = s[iNome] || "Sensor";

                    if (lat && lon && pm25 !== null) {
                        L.circleMarker([lat, lon], {
                            radius: 6,
                            fillColor: getCorPM25(pm25),
                            color: '#000',
                            weight: 1,
                            fillOpacity: 0.85
                        }).bindPopup(`<b>${nome}</b><br>PM2.5: ${pm25} &micro;g/m&sup3;`).addTo(mapPurpleAir);
                    }
                });
            }
        } catch (e) {
            console.error("Erro ao carregar PurpleAir:", e);
        }
    }

    // Legenda com Faixas Exatas de Concentração PM2.5
    function adicionarLegendaPurpleAir() {
        const legend = L.control({ position: 'bottomright' });

        legend.onAdd = function () {
            const div = L.DomUtil.create('div', 'info legend');
            
            const faixas = [
                { cor: '#00e400', rotulo: '0 - 12.0 &micro;g/m&sup3; (Boa)' },
                { cor: '#ffff00', rotulo: '12.1 - 35.4 &micro;g/m&sup3; (Moderada)' },
                { cor: '#ff7e00', rotulo: '35.5 - 55.4 &micro;g/m&sup3; (Insalubre p/ Sensíveis)' },
                { cor: '#ff0000', rotulo: '55.5 - 150.4 &micro;g/m&sup3; (Insalubre)' },
                { cor: '#8f3f97', rotulo: '150.5 - 250.4 &micro;g/m&sup3; (Muito Insalubre)' },
                { cor: '#7e0023', rotulo: '&gt; 250.5 &micro;g/m&sup3; (Perigosa)' }
            ];

            div.innerHTML = '<strong>Concentração PM2.5</strong><br>';
            faixas.forEach(item => {
                div.innerHTML += `<i style="background:${item.cor}"></i> ${item.rotulo}<br>`;
            });

            return div;
        };

        legend.addTo(mapPurpleAir);
    }

    // 5. Ler Dados Mensais e Montar Gráfico
    let dadosMensais = [];
    let meuGrafico = null;

    async function carregarDadosMensais() {
        const dirMensal = "https://dataserver-coids.inpe.br/queimadas/queimadas/focos/csv/mensal/Brasil/";
        const urlArquivoCsv = await obterUltimoArquivoCsv(dirMensal);

        if (!urlArquivoCsv) return;

        Papa.parse(PROXY + encodeURIComponent(urlArquivoCsv), {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(res) {
                if (res.data) {
                    dadosMensais = res.data;
                    
                    const select = document.getElementById('select-estado');
                    select.innerHTML = '<option value="">Selecione um Estado...</option>';
                    const estados = [...new Set(dadosMensais.map(d => d.estado).filter(Boolean))].sort();
                    
                    estados.forEach(est => {
                        const opt = document.createElement('option');
                        opt.value = est;
                        opt.textContent = est;
                        select.appendChild(opt);
                    });

                    select.addEventListener('change', (e) => desenharGrafico(e.target.value));
                }
            }
        });
    }

    function desenharGrafico(estado) {
        if (!estado) return;

        const filtrados = dadosMensais.filter(d => d.estado === estado);
        const porMunicipio = {};

        filtrados.forEach(d => {
            if (d.municipio) {
                porMunicipio[d.municipio] = (porMunicipio[d.municipio] || 0) + 1;
            }
        });

        const top10 = Object.entries(porMunicipio)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 10);

        const ctx = document.getElementById('graficoMensal').getContext('2d');

        if (meuGrafico) meuGrafico.destroy();

        meuGrafico = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: top10.map(item => item[0]),
                datasets: [{
                    label: `Top 10 Municípios com Focos em ${estado}`,
                    data: top10.map(item => item[1]),
                    backgroundColor: 'rgba(255, 87, 34, 0.7)',
                    borderColor: 'rgba(255, 87, 34, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true } }
            }
        });
    }

    // Executar ao carregar a página
    carregarFocosDiarios();
    carregarPurpleAir();
    adicionarLegendaPurpleAir();
    carregarDadosMensais();
</script>

</body>
</html>
