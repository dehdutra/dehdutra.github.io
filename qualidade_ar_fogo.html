<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Focos de Calor & Qualidade do Ar</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet (Mapas) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body { background-color: #f8f9fa; }
        .map-container { height: 450px; width: 100%; border-radius: 8px; }
        .card-custom { border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container-fluid py-4">
    <h2 class="mb-4 text-center">Dashboard: Queimadas e Qualidade do Ar</h2>

    <!-- Mapas Lado a Lado -->
    <div class="row mb-4">
        <!-- Mapa 1: INPE Focos AQUA -->
        <div class="col-lg-6 mb-3">
            <div class="card card-custom p-3">
                <h5 class="card-title">Focos Diários (Satélite AQUA - INPE)</h5>
                <p class="text-muted small">Pontos de calor detectados na América do Sul.</p>
                <div id="mapa-focos" class="map-container"></div>
            </div>
        </div>

        <!-- Mapa 2: PurpleAir -->
        <div class="col-lg-6 mb-3">
            <div class="card card-custom p-3">
                <h5 class="card-title">Qualidade do Ar (PurpleAir - PM2.5)</h5>
                <p class="text-muted small">Sensores coloridos pela concentração de partículas PM2.5.</p>
                <div id="mapa-purpleair" class="map-container"></div>
            </div>
        </div>
    </div>

    <!-- Relatório e Gráfico Mensal -->
    <div class="row">
        <div class="col-12">
            <div class="card card-custom p-3">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
                    <h5 class="card-title mb-0">Relatório Mensal de Focos por Estado</h5>
                    <div class="col-md-3 col-12 mt-2 mt-md-0">
                        <select id="select-estado" class="form-select">
                            <option value="">Selecione um Estado...</option>
                        </select>
                    </div>
                </div>
                <div style="height: 350px;">
                    <canvas id="graficoMensal"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bibliotecas JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
    const PURPLEAIR_KEY = "A8B62FCE-CA6E-11F1-9E30-4201AC1DC129";
    // Proxy simples apenas para liberar a leitura do CSV do INPE pelo navegador
    const PROXY = "https://api.allorigins.win/raw?url=";

    // 1. Inicializar os Mapas
    const mapFocos = L.map('mapa-focos').setView([-14.235, -51.925], 4);
    const mapPurpleAir = L.map('mapa-purpleair').setView([-14.235, -51.925], 4);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OpenStreetMap' }).addTo(mapFocos);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OpenStreetMap' }).addTo(mapPurpleAir);

    // 2. Ler Focos Diários do INPE (Satélite AQUA)
    function carregarFocosDiarios() {
        const urlCsv = PROXY + encodeURIComponent("https://dataserver-coids.inpe.br/queimadas/queimadas/focos/csv/diario/America_Sul/focos_diario_br.csv");

        Papa.parse(urlCsv, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(res) {
                if (res.data) {
                    res.data.forEach(item => {
                        const sat = (item.satelite || '').toUpperCase();
                        if (sat.includes("AQUA")) {
                            const lat = parseFloat(item.lat);
                            const lon = parseFloat(item.lon);
                            if (!isNaN(lat) && !isNaN(lon)) {
                                L.circleMarker([lat, lon], {
                                    radius: 4,
                                    fillColor: '#ff2200',
                                    color: '#880000',
                                    weight: 1,
                                    fillOpacity: 0.8
                                }).bindPopup(`<b>Satélite:</b> ${item.satelite}<br><b>Local:</b> ${item.municipio || ''} - ${item.estado || ''}`).addTo(mapFocos);
                            }
                        }
                    });
                }
            }
        });
    }

    // 3. Cores para o PM2.5 (PurpleAir)
    function getCorPM25(pm) {
        if (pm <= 12.0) return '#00e400'; // Bom (Verde)
        if (pm <= 35.4) return '#ffff00'; // Moderado (Amarelo)
        if (pm <= 55.4) return '#ff7e00'; // Ruim para sensíveis (Laranja)
        if (pm <= 150.4) return '#ff0000'; // Insalubre (Vermelho)
        return '#8f3f97'; // Muito insalubre (Roxo)
    }

    // 4. Ler Pontos do PurpleAir (América do Sul)
    async function carregarPurpleAir() {
        const url = "https://api.purpleair.com/v1/sensors?fields=name,latitude,longitude,pm2.5_10minute&location_type=0&nwlng=-82.0&nwlat=13.0&selng=-32.0&selat=-56.0";

        try {
            const resp = await fetch(url, { headers: { "X-API-Key": PURPLEAIR_KEY } });
            const json = await resp.json();

            if (json && json.data && json.fields) {
                const iLat = json.fields.indexOf("latitude");
                const iLon = json.fields.indexOf("longitude");
                const iPm = json.fields.indexOf("pm2.5_10minute");
                const iNome = json.fields.indexOf("name");

                json.data.forEach(s => {
                    const lat = s[iLat];
                    const lon = s[iLon];
                    const pm25 = s[iPm];
                    const nome = s[iNome] || "Sensor";

                    if (lat && lon && pm25 !== null) {
                        L.circleMarker([lat, lon], {
                            radius: 6,
                            fillColor: getCorPM25(pm25),
                            color: '#000',
                            weight: 1,
                            fillOpacity: 0.8
                        }).bindPopup(`<b>${nome}</b><br>PM2.5: ${pm25} &micro;g/m&sup3;`).addTo(mapPurpleAir);
                    }
                });
            }
        } catch (e) {
            console.error("Erro ao carregar PurpleAir:", e);
        }
    }

    // 5. Ler Dados Mensais e Montar Gráfico
    let dadosMensais = [];
    let meuGrafico = null;

    function carregarDadosMensais() {
        const urlCsv = PROXY + encodeURIComponent("https://dataserver-coids.inpe.br/queimadas/queimadas/focos/csv/mensal/Brasil/focos_mensal_br.csv");

        Papa.parse(urlCsv, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(res) {
                if (res.data) {
                    dadosMensais = res.data;
                    
                    // Preencher o select de estados
                    const select = document.getElementById('select-estado');
                    const estados = [...new Set(dadosMensais.map(d => d.estado).filter(Boolean))].sort();
                    
                    estados.forEach(est => {
                        const opt = document.createElement('option');
                        opt.value = est;
                        opt.textContent = est;
                        select.appendChild(opt);
                    });

                    select.addEventListener('change', (e) => desenharGrafico(e.target.value));
                }
            }
        });
    }

    function desenharGrafico(estado) {
        if (!estado) return;

        // Filtrar focos do estado selecionado e agrupar por município
        const filtrados = dadosMensais.filter(d => d.estado === estado);
        const porMunicipio = {};

        filtrados.forEach(d => {
            if (d.municipio) {
                porMunicipio[d.municipio] = (porMunicipio[d.municipio] || 0) + 1;
            }
        });

        // Pegar os Top 10 Municípios
        const top10 = Object.entries(porMunicipio)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 10);

        const ctx = document.getElementById('graficoMensal').getContext('2d');

        if (meuGrafico) meuGrafico.destroy();

        meuGrafico = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: top10.map(item => item[0]),
                datasets: [{
                    label: `Focos de Calor em ${estado}`,
                    data: top10.map(item => item[1]),
                    backgroundColor: 'rgba(255, 87, 34, 0.7)',
                    borderColor: 'rgba(255, 87, 34, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true } }
            }
        });
    }

    // Executar chamadas ao carregar a página
    carregarFocosDiarios();
    carregarPurpleAir();
    carregarDadosMensais();
</script>

</body>
</html>
